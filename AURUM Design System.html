        e.target.tagName, String(e.target.src || e.target.href || ''));

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

              const { done, value } = await reader.read();

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"18e1abd5-ad95-459f-a1d7-4e65e2d558c8\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"description\" content=\"AURUM — The Interface Standard\">\n<style>\n*{-webkit-print-color-adjust:exact;print-color-adjust:exact}\nbody{margin:0;background:#050506}\n.aurum-page{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif;color:#B9BBC1;font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\nhtml{scroll-behavior:smooth}\na{color:#E8C88F;text-decoration:none}\na:hover{color:#F5E7CC;text-decoration:underline}\np,li,dd{orphans:3;widows:3}\n::selection{background:rgba(232,200,143,.28);color:#F7F0E2}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"aurum-page\" style=\"background:#09090B;min-height:100vh\"><div style=\"max-width:1240px;margin:0 auto;padding:64px 64px 96px\">\n\n<div data-screen-label=\"Cover\" style=\"min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between;break-after:page;background:radial-gradient(120% 60% at 50% 38%,rgba(232,200,143,.09) 0%,rgba(232,200,143,.025) 42%,transparent 70%)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">STANDARD 001<\u002Fspan>\n    <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 26 26\" fill=\"none\"><path d=\"M13 1L25 13L13 25L1 13Z\" stroke=\"#E8C88F\" stroke-width=\"1\"><\u002Fpath><path d=\"M13 6.5L19.5 13L13 19.5L6.5 13Z\" stroke=\"rgba(232,200,143,.45)\" stroke-width=\"1\"><\u002Fpath><circle cx=\"13\" cy=\"13\" r=\"1.4\" fill=\"#E8C88F\"><\u002Fcircle><\u002Fsvg>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">EST. MMCXXVI<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"text-align:center\">\n    <div style=\"font-size:11px;letter-spacing:.52em;color:#E8C88F;font-weight:600;margin-bottom:26px\">THE&nbsp;INTERFACE&nbsp;STANDARD<\u002Fdiv>\n    <div style=\"font-size:108px;font-weight:700;letter-spacing:.16em;line-height:1;padding-left:.16em;background:linear-gradient(118deg,#E8E1D2 0%,#C7C9CD 16%,#F6F3EA 32%,#CBC7BE 46%,#EBCD90 62%,#D3A45B 76%,#96703D 90%,#C9A25C 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">AURUM<\u002Fdiv>\n    <div style=\"width:280px;height:1px;margin:34px auto;background:linear-gradient(90deg,transparent,rgba(232,200,143,.75),transparent)\"><\u002Fdiv>\n    <p style=\"max-width:5.4in;margin:0 auto;font-size:15px;line-height:1.75;color:#C2C4C8;font-weight:400\">A unified design language of titanium, light, and motion — engineered to the tolerances of horology, the velocity of spaceflight, and the clarity of a century of Californian design. Drafted as if recovered from the year 2126.<\u002Fp>\n  <\u002Fdiv>\n  <div>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)\">\n      <div style=\"background:#0B0B0E;padding:14px 18px\"><div style=\"font-size:8.5px;letter-spacing:.2em;color:#7E8188;margin-bottom:5px\">VERSION<\u002Fdiv><div style=\"font-size:12.5px;color:#F4F4F6;font-weight:600\">27.0 — Meridian<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#0B0B0E;padding:14px 18px\"><div style=\"font-size:8.5px;letter-spacing:.2em;color:#7E8188;margin-bottom:5px\">TYPEFACE<\u002Fdiv><div style=\"font-size:12.5px;color:#F4F4F6;font-weight:600\">SF Pro<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#0B0B0E;padding:14px 18px\"><div style=\"font-size:8.5px;letter-spacing:.2em;color:#7E8188;margin-bottom:5px\">PALETTE<\u002Fdiv><div style=\"font-size:12.5px;color:#F4F4F6;font-weight:600\">Titanium · Au 79<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#0B0B0E;padding:14px 18px\"><div style=\"font-size:8.5px;letter-spacing:.2em;color:#7E8188;margin-bottom:5px\">MOTION<\u002Fdiv><div style=\"font-size:12.5px;color:#F4F4F6;font-weight:600\">120 fps native<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;margin-top:18px\">\n      <span style=\"font-size:9px;letter-spacing:.24em;color:#55575D\">DESIGN AUTHORITY · OFFICE OF THE STANDARD<\u002Fspan>\n      <span style=\"font-size:9px;letter-spacing:.24em;color:#55575D\">CUPERTINO · HAWTHORNE · GENEVA<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"Contents\" style=\"break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column\">\n  <div style=\"font-size:10px;letter-spacing:.4em;color:#E8C88F;font-weight:600;margin-bottom:10px\">TABLE OF CONTENTS<\u002Fdiv>\n  <h1 style=\"font-size:40px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0 0 34px\">The complete anatomy<br>of the interface.<\u002Fh1>\n  <div style=\"columns:2;column-gap:0.55in;font-size:12.5px\">\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">00<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Manifesto — The Meridian Doctrine<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">01<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">The Psychology Codex<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">02<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Color — The Titanium Codex<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">03<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Typography — The Voice in Metal<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">04<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Space, Grid &amp; Geometry<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">05<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Materials &amp; Depth — Liquid Glass<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">06<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Iconography<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">07<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Components — The Instrument Panel<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">08<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Motion — The 120 fps Doctrine<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">09<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Sound &amp; Haptics<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">10<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Voice &amp; Tone<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">11<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Accessibility — Universal Luxury<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">12<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">The Four Finishes<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">13<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Governance &amp; The Inspection<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">14<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Application Specimens<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">15<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Materials II — The Full Foundry<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">16<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Menus, Command &amp; Shortcuts<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">17<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Notifications &amp; Messaging<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">18<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Data Visualization — Telemetry<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">19<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Forms II — Pickers &amp; Selection<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">20<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Onboarding &amp; Ceremony<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">21<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Web &amp; Marketing Surfaces<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">22<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Platform Adaptations<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">23<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">The Token Dictionary<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">24<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">The Two Appearances<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">25<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Glossary &amp; The Record<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">26<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">The State Machine<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">27<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Gestures &amp; Input Physics<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">28<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Imagery &amp; Art Direction<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">29<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">The Mark &amp; Wordmark<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">30<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Localization — The World Fit<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">31<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Performance — The Engineering Contract<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">32<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Trust, Privacy &amp; Consequence<\u002Fspan><\u002Fdiv>\n    <div style=\"break-inside:avoid;display:flex;align-items:baseline;gap:12px;padding:5.5px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">33<\u002Fspan><span style=\"color:#F4F4F6;font-weight:500\">Intelligence — AI Surfaces<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:26px;display:flex;gap:20px;border:1px solid rgba(232,200,143,.25);border-radius:14px;padding:16px 20px;background:rgba(232,200,143,.04)\">\n    <span style=\"font-size:10px;letter-spacing:.2em;color:#E8C88F;font-weight:600;white-space:nowrap\">HOW TO READ<\u002Fspan>\n    <p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Every rule in this standard is written to be executed, not admired. Values are exact — pixels, milliseconds, hex, curve coefficients. Where a value is given, it is law. Where a range is given, the narrower reading wins. Specimens are rendered live from the specification itself.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 00 — Manifesto\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;00<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">DOCTRINE<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">00<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Manifesto —<br>The Meridian Doctrine<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">An interface is the only product a person touches ten thousand times a year. AURUM treats each of those touches as a horological event: measured, sprung, and finished on both sides. This section states what we believe; every section after it states what we do about it.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)\">\n    <div style=\"background:#0B0B0E;padding:16px 18px\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F;margin-bottom:6px\">00.1<\u002Fdiv><div style=\"font-size:12px;color:#F4F4F6;font-weight:600\">The Three Lineages<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#0B0B0E;padding:16px 18px\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F;margin-bottom:6px\">00.2<\u002Fdiv><div style=\"font-size:12px;color:#F4F4F6;font-weight:600\">The Five Laws of AURUM<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#0B0B0E;padding:16px 18px\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F;margin-bottom:6px\">00.3<\u002Fdiv><div style=\"font-size:12px;color:#F4F4F6;font-weight:600\">What AURUM Refuses<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">00.1 — THE THREE LINEAGES<\u002Fdiv>\n<h2 style=\"font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 14px\">Horology. Aerospace. Cupertino.<\u002Fh2>\n<p style=\"margin:0 0 18px;max-width:6.2in\">AURUM descends from three schools of engineering that solved the same problem — trust — with three different materials. A watchmaker earns trust with tolerance, an aerospace firm earns it with telemetry, and a California design studio earns it with deference. The standard borrows one governing habit from each.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:0 0 26px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;background:linear-gradient(180deg,#0D0D10,#0A0A0C)\">\n    <div style=\"font-size:9.5px;letter-spacing:.22em;color:#7E8188;margin-bottom:10px\">LINEAGE I · GENEVA<\u002Fdiv>\n    <div style=\"font-size:15px;color:#F4F4F6;font-weight:600;margin-bottom:8px\">Horological precision<\u002Fdiv>\n    <p style=\"margin:0;font-size:11.5px;line-height:1.65;color:#A7AAB0\">One case geometry, repeated for seventy years, corrected by microns. In AURUM every radius, inset, and duration derives from a single base unit — nothing is eyeballed. A component ships when its tolerances are written down, not when it looks done.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;background:linear-gradient(180deg,#0D0D10,#0A0A0C)\">\n    <div style=\"font-size:9.5px;letter-spacing:.22em;color:#7E8188;margin-bottom:10px\">LINEAGE II · HAWTHORNE<\u002Fdiv>\n    <div style=\"font-size:15px;color:#F4F4F6;font-weight:600;margin-bottom:8px\">Aerospace velocity<\u002Fdiv>\n    <p style=\"margin:0;font-size:11.5px;line-height:1.65;color:#A7AAB0\">A control room is dark, dense, and honest: every pixel is telemetry, nothing is ornament. AURUM interfaces default to obsidian, surface real data, and treat latency as a structural failure. If a screen cannot justify an element with a decision it enables, the element is removed.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;background:linear-gradient(180deg,#0D0D10,#0A0A0C)\">\n    <div style=\"font-size:9.5px;letter-spacing:.22em;color:#7E8188;margin-bottom:10px\">LINEAGE III · CUPERTINO<\u002Fdiv>\n    <div style=\"font-size:15px;color:#F4F4F6;font-weight:600;margin-bottom:8px\">Californian clarity<\u002Fdiv>\n    <p style=\"margin:0;font-size:11.5px;line-height:1.65;color:#A7AAB0\">The chrome defers; the content is the interface. AURUM inherits the capsule, the concentric corner, and Liquid Glass — materials that bend light around what matters. Typography does the talking; color is spent like currency, one accent at a time.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">00.2 — THE FIVE LAWS OF AURUM<\u002Fdiv>\n<h2 style=\"font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 16px\">Five laws govern every screen.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:26px\">\n  <div style=\"break-inside:avoid;display:flex;gap:18px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 20px;background:#0C0C0F\">\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;color:#E8C88F\">I<\u002Fspan>\n    <div><div style=\"font-size:13.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Restraint is the ultimate luxury.<\u002Fdiv><p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Gold occupies at most 1% of any screen. A Rolex dial carries one lacquer color; an AURUM view carries one accent. Scarcity is what makes the accent legible as value.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:18px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 20px;background:#0C0C0F\">\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;color:#E8C88F\">II<\u002Fspan>\n    <div><div style=\"font-size:13.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Motion is physics, not decoration.<\u002Fdiv><p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Every animation is a spring with declared mass, stiffness, and damping, resolved at 120 fps. Nothing fades in for atmosphere; things move because a force moved them.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:18px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 20px;background:#0C0C0F\">\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;color:#E8C88F\">III<\u002Fspan>\n    <div><div style=\"font-size:13.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Latency is a material property.<\u002Fdiv><p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Acknowledgement in ≤100 ms, resolution in ≤400 ms, or the interface must visibly account for the time. A slow surface is a flawed surface, exactly as a scratched crystal is.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:18px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 20px;background:#0C0C0F\">\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;color:#E8C88F\">IV<\u002Fspan>\n    <div><div style=\"font-size:13.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Geometry is inherited, never invented.<\u002Fdiv><p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">All corners are concentric, all spacing is a multiple of 4, all capsules are true semicircles. A designer chooses from the scale; only the standard may extend it.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:18px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 20px;background:#0C0C0F\">\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;color:#E8C88F\">V<\u002Fspan>\n    <div><div style=\"font-size:13.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Design for the peak and the end.<\u002Fdiv><p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">People remember the best moment and the last moment of an experience (Kahneman). Every flow in AURUM declares its peak (the moment of success) and finishes it in gold.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">00.3 — WHAT AURUM REFUSES<\u002Fdiv>\n<h2 style=\"font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 14px\">The refusals.<\u002Fh2>\n<p style=\"margin:0 0 16px;max-width:6.2in\">A standard is defined as much by what it forbids. The following are prohibited in any AURUM surface, at any fidelity, in any market:<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:26px\">\n  <div style=\"break-inside:avoid;display:flex;gap:12px;align-items:baseline;padding:12px 16px;border:1px solid rgba(201,111,94,.25);border-radius:12px;background:rgba(201,111,94,.05)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#C96F5E\">✕<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8\">Rainbow gradients, neon glows, or any hue outside the Titanium Codex.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:12px;align-items:baseline;padding:12px 16px;border:1px solid rgba(201,111,94,.25);border-radius:12px;background:rgba(201,111,94,.05)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#C96F5E\">✕<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8\">Linear easing, or any duration not on the motion scale.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:12px;align-items:baseline;padding:12px 16px;border:1px solid rgba(201,111,94,.25);border-radius:12px;background:rgba(201,111,94,.05)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#C96F5E\">✕<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8\">Two primary actions on one view. The hierarchy has one summit.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:12px;align-items:baseline;padding:12px 16px;border:1px solid rgba(201,111,94,.25);border-radius:12px;background:rgba(201,111,94,.05)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#C96F5E\">✕<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8\">Skeuomorphic textures — leather, paper, brushed-metal bitmaps. Material is rendered by light, not by photograph.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:12px;align-items:baseline;padding:12px 16px;border:1px solid rgba(201,111,94,.25);border-radius:12px;background:rgba(201,111,94,.05)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#C96F5E\">✕<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8\">Dark patterns of any species: confirm-shaming, forced continuity, disguised ads, roach motels. Luxury does not trap.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:12px;align-items:baseline;padding:12px 16px;border:1px solid rgba(201,111,94,.25);border-radius:12px;background:rgba(201,111,94,.05)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#C96F5E\">✕<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8\">Text below 11 px, targets below 44 px, contrast below 4.5:1 for body text. No exceptions for aesthetics.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div data-screen-label=\"Part 01 — Psychology\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;01<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">SCIENCE<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">01<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">The Psychology<br>Codex<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">Sixteen findings from a century of cognitive science, each translated into an enforceable AURUM directive. The nervous system this standard targets has not changed since 1952 and will not have changed by 2126: it rewards fluency, punishes latency, remembers peaks, and reads scarcity as worth.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center\">\n    <span style=\"font-size:9.5px;letter-spacing:.2em;color:#55575D\">16 LAWS · 4 NEURO-DOCTRINES · 22 DIRECTIVES<\u002Fspan>\n    <span style=\"font-size:9.5px;letter-spacing:.2em;color:#55575D\">SOURCES: HICK 1952 → KAHNEMAN 2011<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">01.1 — THE SIXTEEN LAWS<\u002Fdiv>\n<h2 style=\"font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 14px\">Findings, then orders.<\u002Fh2>\n<p style=\"margin:0 0 18px;max-width:6.2in\">Each card states the finding, its source, and the directive that binds it into AURUM. Directives are numbered <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:11px;color:#E8C88F\">D-01…D-22<\u002Fspan> and are cited throughout the later parts of this standard.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 01<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">KUROSU &amp; KASHIMURA · 1995<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Aesthetic–Usability Effect<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Users judge beautiful interfaces as easier to use and forgive their minor faults; perceived usability correlates with apparent beauty more than with actual usability.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-01&nbsp;<\u002Fspan>Finish is functional. Polish (alignment to 1 px, hairline consistency, optical corrections) is a release requirement, never a stretch goal.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 02<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">HICK &amp; HYMAN · 1952<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Hick's Law<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Decision time grows logarithmically with the number of choices: T = b·log₂(n+1). Every added option taxes every user on every visit.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-02&nbsp;<\u002Fspan>Maximum 5 top-level destinations, 7 menu items per group, 1 primary action per view. Progressive disclosure beyond that.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 03<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">FITTS · 1954<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Fitts's Law<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Time to acquire a target is a function of distance over size: ID = log₂(2D/W). Small, far targets are slow and error-prone.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-03&nbsp;<\u002Fspan>Touch targets ≥44×44 px, pointer targets ≥28 px, primary actions within thumb reach on handheld, 8 px minimum between adjacent targets.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 04<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">MILLER · 1956<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Miller's Law (7±2)<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Working memory holds roughly four to seven chunks. Interfaces that exceed the chunk budget force re-reading and error.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-04&nbsp;<\u002Fspan>Group content into 3–5 chunks per view. Serial numbers, codes, and card numbers render in groups of 4 with hair-space separators.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 05<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">NIELSEN · 2000<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Jakob's Law<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Users spend most of their time in other products; they import those expectations into yours. Novelty in mechanics is paid for in confusion.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-05&nbsp;<\u002Fspan>Innovate in finish, never in mechanics: navigation, gestures, and form patterns follow platform convention (iOS/macOS HIG) exactly.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 06<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">DOHERTY &amp; THADANI · 1982<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Doherty Threshold<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Below ~400 ms system response, productivity and engagement rise sharply; the human and the machine stay in one conversational rhythm.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-06&nbsp;<\u002Fspan>Acknowledge input ≤100 ms, resolve ≤400 ms. 400–2000 ms shows determinate progress; &gt;2 s shows progress + narrative (what is happening).<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 07<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">KAHNEMAN &amp; FREDRICKSON · 1993<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Peak–End Rule<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Experiences are remembered by their most intense moment and their final moment, not their average. Endings are disproportionately cheap leverage.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-07&nbsp;<\u002Fspan>Every flow declares one peak. Success states get the full treatment: gold accent, spring choreography, haptic (soft), and a considered closing line.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 08<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">VON RESTORFF · 1933<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Von Restorff (Isolation) Effect<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Among uniform items, the one that differs is remembered and chosen. Distinctiveness only works when everything else is disciplined.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-08&nbsp;<\u002Fspan>Exactly one gold element per view — the primary action or the key figure. If two things are gold, neither is. This is the 1% rule's enforcement arm.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 09<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">ZEIGARNIK · 1927<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Zeigarnik Effect<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Interrupted tasks are remembered better than completed ones; open loops occupy the mind until closed.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-09&nbsp;<\u002Fspan>Unfinished states are first-class: drafts, resumable flows, and \"continue where you left off\" surfaces are required for any task &gt;3 steps.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 10<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">HULL · 1932<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Goal-Gradient Effect<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Effort accelerates as the goal nears; perceived progress motivates more than actual progress.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-10&nbsp;<\u002Fspan>Multi-step flows open with the first step pre-completed (\"1 of 5 — done\"). Progress indicators are always visible, never reset, and never move backward.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 11<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">EBBINGHAUS · 1885<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Serial Position Effect<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">First and last items in a sequence are recalled best; the middle is a memory dead zone.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-11&nbsp;<\u002Fspan>Navigation places the two highest-value destinations at the ends of the bar. Lists surface critical rows first; destructive options sit last, never middle.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 12<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">TESLER · 1984<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Tesler's Law of Conservation<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Every process has irreducible complexity; the only question is who absorbs it — the user or the system.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-12&nbsp;<\u002Fspan>The system absorbs. Smart defaults, inferred fields, and automatic formatting are mandatory; a form may never ask what the system can know.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 13<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">WEBER &amp; FECHNER · 1860<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Weber–Fechner Law<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Perception is logarithmic: the just-noticeable difference is proportional to the baseline. Equal perceptual steps require geometric physical steps.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-13&nbsp;<\u002Fspan>Tonal ramps, type scales, and spacing scales are geometric, not arithmetic. Elevation shadows double per level; type steps multiply by ~1.2.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 14<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">ZAJONC · 1968 / REBER · 2004<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Processing Fluency &amp; Mere Exposure<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">The brain misreads ease of processing as beauty and truth, and familiarity as preference. Consistency literally makes a product feel more honest.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-14&nbsp;<\u002Fspan>One geometry, one palette, one motion signature everywhere. A pattern introduced once is reused verbatim; variants require a written exception.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 15<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">VEBLEN · 1899<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">The Veblen Read of Luxury<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Humans read cost signals — material scarcity, evident labor, restraint — as worth. In interfaces, the signals are emptiness, precision, and patience: whitespace is the digital equivalent of a boutique with three items on display.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-15&nbsp;<\u002Fspan>Density ceilings: hero surfaces ≤40% ink coverage; one message per screen in onboarding; the interface never shouts, never blinks, never begs.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">LAW 16<\u002Fspan><span style=\"font-size:9px;letter-spacing:.12em;color:#55575D\">WILSON · 2002 (EMBODIED COGNITION)<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Embodied Weight<\u002Fdiv>\n    <p style=\"margin:0 0 10px;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Cognition borrows from the body: things that respond with mass, spring, and friction are perceived as real and valuable; weightless UI reads as cheap.<\u002Fp>\n    <div style=\"font-size:11px;line-height:1.55;color:#D6D7DA;padding-top:10px;border-top:1px solid rgba(232,200,143,.2)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F\">D-16&nbsp;<\u002Fspan>Every interactive element has declared mass: press compresses (scale 0.97), release springs back with slight overshoot, drags carry momentum and rubber-band at bounds.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-before:page;font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">01.2 — THE NEUROPHYSIOLOGY OF SMOOTH<\u002Fdiv>\n<h2 style=\"font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 14px\">Why 120 fps is a psychological spec, not a technical one.<\u002Fh2>\n<p style=\"margin:0 0 16px;max-width:6.4in\">The eye tracks moving interface elements with smooth-pursuit movements at up to 30°/second. At 60 fps, a fast-scrolling element jumps ~8 px between frames — enough for the retina to register discrete ghosts. At 120 fps the inter-frame displacement halves, falling below the motion-smear threshold at typical viewing distances; pursuit locks on, and the element reads as a physical object rather than a slideshow of one. This is the mechanism behind the \"buttery\" adjective: it is not preference, it is pursuit-tracking error dropping below perceptual threshold.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Doctrine N-1 · The 8.33 ms contract<\u002Fdiv>\n    <p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">At 120 Hz a frame owns 8.33 ms. AURUM budgets: input processing ≤1 ms, script ≤2 ms, style/layout ≤1.5 ms, paint ≤1.5 ms, composite ≤1.5 ms, margin 0.83 ms. Any animation that cannot meet the contract is redesigned, never allowed to stutter.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Doctrine N-2 · Sub-100 ms = agency<\u002Fdiv>\n    <p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Feedback within ~100 ms is perceived as caused by oneself (Card, Moran &amp; Newell); beyond it, the machine \"did something.\" Press states therefore begin on <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10.5px\">pointerdown<\u002Fspan> — never on release — and appear within one frame.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Doctrine N-3 · Peripheral calm<\u002Fdiv>\n    <p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">Peripheral vision is motion-sensitive and alarm-wired. Nothing outside the user's focus may animate uninvited: no auto-playing shimmer, no pulsing badges, no ambient loops above 2% luminance delta. Motion is a response, not a mood.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Doctrine N-4 · The dark-adaptation asset<\u002Fdiv>\n    <p style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.6\">On OLED, true blacks let the display disappear and content float — the SpaceX control-room effect. AURUM's obsidian base (#09090B, never #000) preserves shadow detail while keeping the bezel illusion; large white fields are forbidden in dark contexts (bloom destroys adaptation).<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"break-inside:avoid;border:1px solid rgba(232,200,143,.3);border-radius:16px;padding:20px 24px;background:linear-gradient(180deg,rgba(232,200,143,.07),rgba(232,200,143,.02));margin-bottom:26px\">\n  <div style=\"font-size:9.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin-bottom:8px\">SYNTHESIS — THE AURUM EQUATION<\u002Fdiv>\n  <p style=\"margin:0;font-size:13px;line-height:1.7;color:#D6D7DA\"><span style=\"color:#F4F4F6;font-weight:600\">Premium = fluency × restraint × physics.<\u002Fspan> Fluency makes the interface feel true (Law 14), restraint makes it feel valuable (Laws 8, 15), and physics makes it feel real (Law 16, Doctrines N-1…N-4). Remove any factor and the product collapses into ordinary. Every rule in Parts 02–13 exists to hold one of these three factors.<\u002Fp>\n<\u002Fdiv>\n<div data-screen-label=\"Part 02 — Color\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;02<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">FOUNDATION<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">02<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Color —<br>The Titanium Codex<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">AURUM's palette is machined, not painted: four ramps derived from titanium finishes — Obsidian, Titanium, Pearl, and Aurum Gold — plus four muted signal hues. Ninety percent of every screen is neutral metal; one percent is gold. Everything in between is light behaving on a surface.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;height:88px;border:1px solid rgba(255,255,255,.1)\">\n    <div style=\"flex:38;background:#09090B\"><\u002Fdiv>\n    <div style=\"flex:14;background:#0C0C0F\"><\u002Fdiv>\n    <div style=\"flex:12;background:#16161A\"><\u002Fdiv>\n    <div style=\"flex:10;background:#33353D\"><\u002Fdiv>\n    <div style=\"flex:8;background:#8A8D93\"><\u002Fdiv>\n    <div style=\"flex:7;background:#C2C4C8\"><\u002Fdiv>\n    <div style=\"flex:6;background:#F4F4F6\"><\u002Fdiv>\n    <div style=\"flex:5;background:linear-gradient(180deg,#F5E7CC,#E8C88F)\"><\u002Fdiv>\n    <div style=\"flex:3;background:linear-gradient(180deg,#D9B279,#A87E45)\"><\u002Fdiv>\n    <div style=\"flex:2;background:#6B4C24\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">02.1 — THE FOUR RAMPS<\u002Fdiv>\n<h2 style=\"font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 14px\">Machined tonal ramps.<\u002Fh2>\n<p style=\"margin:0 0 18px;max-width:6.4in\">Ramps are geometric in luminance (D-13): each step is a constant perceptual interval, so any two adjacent steps form a usable hairline relationship and any three-step jump forms a usable text relationship. Steps are named by ramp and weight; the weight is stable law — <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:11px;color:#D6D7DA\">AU-300<\u002Fspan> is the same metal in every product, every year.<\u002Fp>\n\n<figure style=\"break-inside:avoid;margin:0 0 16px;border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden;background:#0C0C0F\">\n  <figcaption style=\"display:flex;justify-content:space-between;align-items:center;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,.07)\">\n    <span style=\"font-size:9.5px;letter-spacing:.18em;color:#E8C88F;font-weight:600\">RAMP A — OBSIDIAN<\u002Fspan>\n    <span style=\"font-size:9.5px;letter-spacing:.12em;color:#7E8188\">STRUCTURE · BACKGROUNDS &amp; SURFACES<\u002Fspan>\n  <\u002Ffigcaption>\n  <div style=\"display:grid;grid-template-columns:repeat(8,1fr);gap:0;padding:16px 18px 14px\">\n    <div><div style=\"height:50px;background:#050506;border:1px solid rgba(255,255,255,.12);border-radius:8px 0 0 8px\"><\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#D6D7DA;margin-top:7px\">#050506<\u002Fdiv><div style=\"font-size:8px;color:#7E8188;letter-spacing:.06em\">OB-000 · VOID<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"height:50px;background:#09090B;border:1px solid rgba(255,255,255,.12);border-left:none\"><\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#D6D7DA;margin-top:7px\">#09090B<\u002Fdiv><div style=\"font-size:8px;color:#E8C88F;letter-spacing:.06em\">OB-050 · CANVAS<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"height:50px;background:#0C0C0F;border:1px solid rgba(255,255,255,.12);border-left:none\"><\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#D6D7DA;margin-top:7px\">#0C0C0F<\u002Fdiv><div style=\"font-size:8px;color:#7E8188;letter-spacing:.06em\">OB-100 · SURFACE-1<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"height:50px;background:#101014;border:1px solid rgba(255,255,255,.12);border-left:none\"><\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#D6D7DA;margin-top:7px\">#101014<\u002Fdiv><div style=\"font-size:8px;color:#7E8188;letter-spacing:.06em\">OB-150 · SURFACE-2<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"height:50px;background:#16161A;border:1px solid rgba(255,255,255,.12);border-left:none\"><\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#D6D7DA;margin-top:7px\">#16161A<\u002Fdiv><div style=\"font-size:8px;color:#7E8188;letter-spacing:.06em\">OB-200 · HOVER<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"height:50px;background:#1C1D22;border:1px solid rgba(255,255,255,.12);border-left:none\"><\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#D6D7DA;margin-top:7px\">#1C1D22<\u002Fdiv><div style=\"font-size:8px;color:#7E8188;letter-spacing:.06em\">OB-300 · PRESSED<\u002Fdiv><\u002Fdiv>\n
