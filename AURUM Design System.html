;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Zoom about the pinch centroid, never viewport center<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Rubber-band past min/max ×0.55<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Pull-to-refresh<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Overscroll at top<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">64 px — haptic light at arm<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Orbital spinner winds with pull distance<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Release before 64 px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Every gesture has a visible-control twin (22 input parity); gestures are accelerators, never the only door.<\u002Fli>\n  <li>Destructive swipes (Delete) never auto-commit at full swipe on first use — the tray button must be tapped until the user has committed the gesture 3 times (earned trust).<\u002Fli>\n  <li>System-edge gestures own the outer 20 px; AURUM surfaces never place actionable edges inside the system's reach.<\u002Fli>\n  <li>Pointer accessories: on hover-capable touch (pencil, trackpad), rows show their swipe actions as trailing buttons on hover instead.<\u002Fli>\n<\u002Ful>\n\n<div data-screen-label=\"Part 28 — Imagery\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;28<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">LENS<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">28<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Imagery &amp; Art Direction<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">AURUM photographs the way it renders: hardware under one overhead light, held in darkness. Product is the only subject; people appear as operators, never as stock-smiling decoration. Every image passes the same grade before it touches a surface.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:18px\">\n    <div style=\"font-size:9.5px;letter-spacing:.2em;color:#E8C88F;font-weight:600;margin-bottom:12px\">THE GRADE — APPLIED TO EVERY ASSET<\u002Fdiv>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:10.5px\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8;width:110px\">Black point<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">Lifted to #050506 — no crushed 0,0,0<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">White point<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">Capped ≈ #F4F4F6 — highlights never bloom (N-4)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">Temperature<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">5600 K neutral; +300 K only inside gold highlights<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">Saturation<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">−20 global; hues drift toward Titanium; one warm accent may survive<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">Light<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">Single key at 90° overhead ±15° — matches 05.3's sun<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:#C2C4C8\">Grain<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">≤1.5% luma monochrome; digital-clean is acceptable, plastic-smooth is not<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li>Containers: media sits in r-5 (20) frames or full-bleed — never floating with its own drop shadow.<\u002Fli>\n    <li>Text over imagery requires a scrim gradient (180°, 0→60% OB-000) or a Glass card — never raw type on photograph.<\u002Fli>\n    <li>3-D renders follow physical-camera rules: 35–85 mm equivalents, f/2.8–f/8; no orthographic hero shots, no impossible chrome.<\u002Fli>\n    <li>Duotone treatment (editorial only): shadows OB-100, highlights AU-200 — the one permitted colorization.<\u002Fli>\n    <li>Aspect grammar: 16:9 cinematic hero · 4:3 product study · 1:1 catalog tile · 9:16 story. Free-crop is a defect.<\u002Fli>\n    <li>Loading: LQIP blur-up 24 px→0 over 240 ms inside the frame; layout space is reserved at exact aspect (07.8 skeleton law).<\u002Fli>\n    <li>Forbidden: watermarked stock, emoji-sticker collages, AI-artifact hands, lens flares, tilted horizons under 3° (either level it or commit past 8°).<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 29 — The Mark\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;29<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">HALLMARK<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">29<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">The Mark &amp; Wordmark<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">The mark is a lozenge within a lozenge — a stone in its setting. The wordmark is the letterform A-U-R-U-M in SF Pro 700, tracked +16%, struck in Chrome. Together they behave like a hallmark: small, exact, and never repeated on the same surface.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-bottom:14px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:radial-gradient(100% 100% at 50% 30%,#101014,#09090B);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px\">\n    <div style=\"position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center\">\n      <div style=\"position:absolute;inset:-14px;border:1px dashed rgba(232,200,143,.25);border-radius:4px\"><\u002Fdiv>\n      <svg width=\"96\" height=\"96\" sc-camel-view-box=\"0 0 26 26\" fill=\"none\"><path d=\"M13 1L25 13L13 25L1 13Z\" stroke=\"#E8C88F\" stroke-width=\".9\"><\u002Fpath><path d=\"M13 6.5L19.5 13L13 19.5L6.5 13Z\" stroke=\"rgba(232,200,143,.45)\" stroke-width=\".9\"><\u002Fpath><circle cx=\"13\" cy=\"13\" r=\"1.3\" fill=\"#E8C88F\"><\u002Fcircle><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"font-size:20px;font-weight:700;letter-spacing:.16em;padding-left:.16em;background:linear-gradient(118deg,#E8E1D2,#C7C9CD 16%,#F6F3EA 32%,#CBC7BE 46%,#EBCD90 62%,#D3A45B 78%,#C9A25C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">AURUM<\u002Fdiv>\n    <figcaption style=\"font-size:9px;color:#7E8188;letter-spacing:.1em;text-align:center\">CLEARSPACE = ½ MARK WIDTH, ALL SIDES (DASHED)<\u002Ffigcaption>\n  <\u002Ffigure>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li>Construction: outer lozenge = square rotated 45°, stroke 1/26 of width; inner at ½ scale, 45% alpha; center point r 1.3/26. Never redrawn freehand.<\u002Fli>\n    <li>Minimum sizes: mark 16 px digital / 4 mm print; wordmark 60 px / 12 mm. Below minimum, use the mark alone.<\u002Fli>\n    <li>Colorways, in order of preference: Chrome (ceremony), AU-300 solid, TI-100 solid, #1A1206 on gold fields. Nothing else — no outlines-only wordmark, no photographic fills.<\u002Fli>\n    <li>Placement: one mark per surface, anchored to a corner of the grid, never centered over content. The footer Chrome strike (21) is the only full-size wordmark in product.<\u002Fli>\n    <li>Misuse (all forbidden): rotation, shear, glow, drop shadow, containment in a circle, pairing with another logo closer than 2× clearspace.<\u002Fli>\n    <li>Co-branding: partner marks render in TI-400 monochrome at optically equal mass, separated by a 1 px hairline column, AURUM leftmost.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 30 — Localization\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;30<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">WORLD<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">30<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Localization — The World Fit<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">A standard that only fits English is a prototype. AURUM layouts are cut with expansion seams, mirrored hinges, and script-aware metal, so the same watch fits every wrist on Earth — which is the actual meaning of \"every human.\"<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:18px\">\n    <div style=\"font-size:9.5px;letter-spacing:.2em;color:#E8C88F;font-weight:600;margin-bottom:12px\">EXPANSION SEAMS — BUDGET BY STRING LENGTH<\u002Fdiv>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:10.5px\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8;width:120px\">≤10 chars (EN)<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">reserve +200% — “On” → “Aktiviert”<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">11–20 chars<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">reserve +100%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">21–50 chars<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">reserve +50%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">&gt;50 chars<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">reserve +30% and allow wrap to 2 lines<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:#C2C4C8\">Overflow order<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">wrap → compress tracking −1% → truncate with … + tooltip. Never clip.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li>RTL (Arabic, Hebrew): the layout mirrors on its hinge — nav, chevrons, progress, swipe trays, table alignment. Non-mirroring survivors: clocks, media transport, phone numbers, charts' time axes, the mark.<\u002Fli>\n    <li>CJK: line-height rises to 1.7× (body 15/26); tracking resets to 0 (never negative); overline eyebrows drop letterspacing and use weight 700 instead.<\u002Fli>\n    <li>Scripts map to system stacks: SF Pro → PingFang SC/TC · Hiragino Sans · Apple SD Gothic Neo · SF Arabic · SF Hebrew; numerals stay SF Mono tabular in telemetry worldwide.<\u002Fli>\n    <li>Formats are locale-owned: dates, decimal separators, currency position, first day of week — never hard-coded (D-12: the system absorbs).<\u002Fli>\n    <li>Tall scripts (Thai, Devanagari): control heights hold; internal padding absorbs ascenders — 44 px was chosen to survive them.<\u002Fli>\n    <li>Pseudo-localization (⟦ᴡᴇʟcöṁé⟧ +40%) runs in CI; a clipped string is a G-gate failure, not a translation bug.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 31 — Performance\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;31<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">CONTRACT<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">31<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Performance — The Engineering Contract<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">Latency is a material property (Law III); this part prices it. The budgets below are signed by design AND engineering at kickoff — a feature that cannot afford them is redesigned before it is optimized.<\u002Fp>\n<\u002Fdiv>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:10.5px;margin:0 0 14px\">\n  <sc-raw-thead><sc-raw-tr>\n    <sc-raw-th style=\"text-align:left;padding:7px 8px;font-size:8.5px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">MOMENT<\u002Fsc-raw-th>\n    <sc-raw-th style=\"text-align:left;padding:7px 8px;font-size:8.5px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">BUDGET (P75)<\u002Fsc-raw-th>\n    <sc-raw-th style=\"text-align:left;padding:7px 8px;font-size:8.5px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">DEGRADED MODE — WHAT THE USER SEES INSTEAD OF WAITING<\u002Fsc-raw-th>\n  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n  <sc-raw-tbody>\n    <sc-raw-tr><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Cold start → first content<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">≤1.2 s<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Canvas + bars paint instantly from cache; skeletons in the content region only<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Route change<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">≤400 ms<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Shared-element morph starts immediately; data streams into the settled frame<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Interaction → paint<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">≤8.33 ms/frame, 0 dropped<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">None. This budget has no degraded mode (G-03)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Search-as-you-type<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">≤120 ms/keystroke<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Local index answers first; network refines silently — results never reshuffle under a hovering pointer<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Layout shift<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">CLS = 0 after first paint<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">All async regions pre-reserved (07.8, 28); ads do not exist in AURUM products<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Offline<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">Read: full · Write: queued<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Solar banner “Working offline — changes sync when connected”; queued items badge TI, never block<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Perceived-speed toolkit, in permitted order: optimistic commit (with guaranteed undo) → skeleton → determinate progress → narrative progress. Spinners alone may cover only 400–2000 ms.<\u002Fli>\n  <li>Animation runs on the compositor thread exclusively; any main-thread animation is rejected in review by static analysis, not by eye.<\u002Fli>\n  <li>Asset ceilings per view: 200 KB script, 120 KB image (above the fold), 2 font files. The obsidian aesthetic is also an engineering subsidy — dark pixels are cheap pixels on OLED.<\u002Fli>\n<\u002Ful>\n\n<div data-screen-label=\"Part 32 — Trust\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;32<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">VAULT<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">32<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Trust, Privacy &amp; Consequence<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">Luxury is, finally, trust. AURUM treats the user's data like a vault treats bullion: asked for only when needed, shown only when summoned, and moved only with ceremony. These patterns are binding wherever consequence is real — money, identity, deletion, launch.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:radial-gradient(90% 120% at 50% 0%,#101014,#09090B);padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center\">\n    <div style=\"width:100%;max-width:280px;border-radius:20px;background:rgba(16,16,20,.88);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 24px rgba(0,0,0,.5);padding:20px\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\"><span style=\"width:32px;height:32px;border-radius:10px;background:rgba(232,200,143,.12);border:1px solid rgba(232,200,143,.3);display:inline-flex;align-items:center;justify-content:center\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"3\"><\u002Frect><path d=\"M8 10V7a4 4 0 018 0v3\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#F4F4F6\">Allow location while flying?<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0 0 6px;font-size:11px;color:#A7AAB0;line-height:1.6\">Guidance uses your position to hold the corridor. Stored on device, discarded at touchdown.<\u002Fp>\n      <div style=\"font-size:9.5px;color:#7E8188;margin-bottom:12px\">You can change this in System → Privacy.<\u002Fdiv>\n      <div style=\"display:flex;gap:8px\"><span style=\"flex:1;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.16);color:#F4F4F6;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center\">Not now<\u002Fspan><span style=\"flex:1;height:34px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center\">Allow in flight<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:9.5px;color:#7E8188;line-height:1.6;text-align:center\">The permission ask: in context, at the moment of need, with the retention policy in plain words.<\u002Ffigcaption>\n  <\u002Ffigure>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li>Ask at the moment of use, never at install; each ask states purpose + retention in ≤2 sentences; “Not now” is always equal-weight and remembered.<\u002Fli>\n    <li>Sensitive figures (balances, keys, coordinates) render masked (••••) by default with a reveal eye; reveal auto-relocks after 30 s or on blur; masked values never enter screenshots on platforms that allow exclusion.<\u002Fli>\n    <li>Biometric ceremonies: the sheet dims the world (scrim 60%), shows the operation + exact amount, and confirms with the platform's own biometric sheet — AURUM never draws a fake Face ID.<\u002Fli>\n    <li>Irreversibles use typed confirmation (“type DEORBIT to confirm”) above $10k-equivalent consequence; otherwise the two-press dialog (07.7).<\u002Fli>\n    <li>Undo beats confirm wherever physics allows: destructive-with-undo (30 s grace, toast + Undo) is preferred to confirm-then-destroy (D-12 dignity: don't interrogate, insure).<\u002Fli>\n    <li>Security status uses Patina/Oxide only with words (“Encrypted · on device”); padlock glyphs never appear decoratively.<\u002Fli>\n    <li>Data export and deletion are first-class settings rows, one level deep, in the same type size as everything else — burying them is a dark pattern (00.3).<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 33 — Intelligence\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;33<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">ORACLE<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">33<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Intelligence — AI Surfaces<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">By 2126 the model is not a feature; it is the junior officer on the bridge. AURUM gives it a uniform: intelligence is always labeled, always interruptible, always overridable, and never wears gold — gold belongs to the human's decisions.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:18px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"border-radius:16px;border:1px solid rgba(127,166,201,.3);background:rgba(127,166,201,.05);padding:14px 16px\">\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:8px\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7FA6C9\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z\"><\u002Fpath><path d=\"M18.5 15l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9px;letter-spacing:.18em;color:#7FA6C9;font-weight:600\">DRAFTED BY MERIDIAN · CHECK BEFORE USE<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0 0 10px;font-size:11.5px;color:#C2C4C8;line-height:1.6\">Window 14 closes in 3 h 12 m. Moving the burn to 22:40 saves 9.8 m/s and clears the debris corridor by 41 km.<\u002Fp>\n      <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"height:30px;padding:0 14px;border-radius:999px;border:1px solid rgba(127,166,201,.4);color:#7FA6C9;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center\">Apply 22:40<\u002Fspan><span style=\"height:30px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:#A7AAB0;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center\">Show working<\u002Fspan><span style=\"margin-left:auto;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#55575D\">CONF 0.93<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:9.5px;color:#7E8188;line-height:1.6\">The suggestion card: Glacier-bordered, source-labeled, confidence stated, evidence one tap away — and its action is a bordered ghost, not a gold capsule. Gold arrives only when the human commits.<\u002Ffigcaption>\n  <\u002Ffigure>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li>Provenance law: generated content carries the Glacier spark glyph + “Drafted by …” label at all sizes, in exports, and in print. Unlabeled generation is counterfeit trust.<\u002Fli>\n    <li>Confidence renders in three words, not percentages, in prose surfaces: “verified” (checked against source) · “likely” (&gt;0.8) · “speculative” (≤0.8, always with Show working). Raw CONF figures appear only in telemetry contexts.<\u002Fli>\n    <li>Streaming text arrives in reading rhythm (≈40 ms/word), stops instantly on ⎋ or scroll-up, and never pushes content the user is reading (frame integrity beats freshness).<\u002Fli>\n    <li>The model may prepare, never commit: destructive, financial, and broadcast actions require the human press. Auto-apply exists only below the consequence floor (undoable, ≤1 view of effect).<\u002Fli>\n    <li>Corrections train silently: “Edit” on any suggestion opens the draft in place; the diff is the feedback. No thumbs-ratings litter (D-15).<\u002Fli>\n    <li>When the model is uncertain or offline it says so in the concierge register (“I can't verify the corridor right now”) — hedging is honesty, hallucinated confidence is a G-gate failure.<\u002Fli>\n    <li>Ambient intelligence obeys N-3: no glowing halos, no pulsing orbs. The presence of the model is typographic, not theatrical.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Hallmark\" style=\"break-before:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(110% 55% at 50% 42%,rgba(232,200,143,.08) 0%,rgba(232,200,143,.02) 45%,transparent 70%)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">CLOSING<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">HALLMARK<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"text-align:center\">\n    <svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 26 26\" fill=\"none\" style=\"margin-bottom:30px\"><path d=\"M13 1L25 13L13 25L1 13Z\" stroke=\"#E8C88F\" stroke-width=\".8\"><\u002Fpath><path d=\"M13 6.5L19.5 13L13 19.5L6.5 13Z\" stroke=\"rgba(232,200,143,.45)\" stroke-width=\".8\"><\u002Fpath><circle cx=\"13\" cy=\"13\" r=\"1.2\" fill=\"#E8C88F\"><\u002Fcircle><\u002Fsvg>\n    <div style=\"font-size:30px;font-weight:700;letter-spacing:-.02em;color:#F4F4F6;line-height:1.35;max-width:6in;margin:0 auto 26px\">Build as if the person on the other side<br>of the glass can feel the tolerances.<br><span style=\"background:linear-gradient(118deg,#E8E1D2,#C7C9CD 16%,#F6F3EA 32%,#CBC7BE 46%,#EBCD90 62%,#D3A45B 78%,#C9A25C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">Because they can.<\u002Fspan><\u002Fdiv>\n    <div style=\"width:220px;height:1px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,rgba(232,200,143,.7),transparent)\"><\u002Fdiv>\n    <p style=\"margin:0 auto;max-width:4.8in;font-size:11.5px;line-height:1.8;color:#7E8188\">Thirty-three parts. Sixteen laws, nine states, four ramps, nine type sizes, ten spacing stops, six radii, five materials, six altitudes, five tempos, four springs, four finishes, ten gates — four hundred twelve tokens, one grammar. Everything else is craft.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end\">\n    <div style=\"font-size:9px;letter-spacing:.24em;color:#55575D;line-height:2\">AURUM — THE INTERFACE STANDARD 001<br>EDITION I · MERIDIAN · MMCXXVI<\u002Fdiv>\n    <div style=\"text-align:right;font-size:9px;letter-spacing:.24em;color:#55575D;line-height:2\">RATIFIED BY THE OFFICE OF THE STANDARD<br>CUPERTINO · HAWTHORNE · GENEVA<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv><\u002Fdiv>\n\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const apply = () => {\n      const dp = document.querySelector('doc-page');\n      if (dp && dp.shadowRoot) {\n        if (!dp.shadowRoot.querySelector('#aurum-sheet')) {\n          const s = document.createElement('style');\n          s.id = 'aurum-sheet';\n          s.textContent = '.sheet{background:#09090B !important;box-shadow:0 0 0 1px rgba(232,200,143,.14),0 2px 24px rgba(0,0,0,.6) !important}';\n          dp.shadowRoot.appendChild(s);\n        }\n      }\n    };\n    apply();\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fdiv><\u002Fdiv><\u002Fx-dc><\u002Fbody><\u002Fhtml>"
