0px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">spring.snappy<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">420 / 30 / 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Controls; ≤4% overshoot<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">spring.gentle<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">210 / 24 / 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Surfaces, sheets; critically damped feel<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">spring.glide<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">120 / 20 / 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Scroll-linked, parallax, large panes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">spring.ceremony<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">170 / 26 / 1.2<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Peak reveals; weighted, unhurried<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"margin:0 0 22px;font-size:10.5px;color:#7E8188;max-width:6.6in\">Interruptibility is law: every spring animates from current position and velocity — a mid-flight target change redirects, never restarts. Only <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px\">transform<\u002Fspan> and <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px\">opacity<\u002Fspan> animate (compositor-only, the N-1 contract); layout properties never do. CSS fallback for non-spring contexts: <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px\">cubic-bezier(0.22, 1, 0.36, 1)<\u002Fspan>.<\u002Fp>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">08.2 — CHOREOGRAPHY<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Order of arrival.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px\">\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11.5px;color:#A7AAB0;line-height:1.85\">\n    <li>Entrances: opacity 0→1 with translateY 12→0 (never scale-from-zero for content).<\u002Fli>\n    <li>Stagger 40 ms between siblings, cap 6 staggered items — the 7th onward arrives with the 6th.<\u002Fli>\n    <li>Structure leads, content follows: container at t=0, children at t+80.<\u002Fli>\n    <li>Exits are 60% the duration of entrances, downhill, no stagger.<\u002Fli>\n    <li>Shared-element transitions: the tapped card IS the detail view — one object, morphing r 20→0, on spring.gentle.<\u002Fli>\n  <\u002Ful>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11.5px;color:#A7AAB0;line-height:1.85\">\n    <li>Scroll physics: iOS deceleration curve; rubber-band at bounds (offset × 0.55 resistance); momentum never clamped.<\u002Fli>\n    <li>Parallax budget: background layers move at 0.85×, never more than 40 px total travel, disabled under reduced-motion.<\u002Fli>\n    <li>Number changes roll per-digit (odometer), 240 ms, tabular width locked.<\u002Fli>\n    <li>Forbidden: bounce loops, attention shakes, spin-ins, flips, blur-in text, anything longer than t-ceremony.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 09 — Sound &amp; Haptics\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;09<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">SENSORY<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">09<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Sound &amp; Haptics — The Escapement<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">A Rolex is silent except when it must not be; its click is a single, certain event. AURUM sound is the same: nearly always silent, and unmistakable when it speaks. Haptics are the escapement — tiny mechanical truths under the finger.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px\">\n  <sc-raw-table style=\"border-collapse:collapse;font-size:11px\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;padding:7px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">EVENT<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:7px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">SOUND<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:7px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">HAPTIC<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">Primary success<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Single struck note, 120 ms, −18 LUFS<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">success (soft double)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">Toggle / detent<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">None<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">light (single tick)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">Destructive confirm<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Low thud, 90 ms<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">rigid<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">Error<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Muted knock, never a buzzer<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">error (triple soft)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">Everything else<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#E8C88F\">Silence<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#A7AAB0\">none<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11.5px;color:#A7AAB0;line-height:1.85\">\n    <li>Sound palette: struck metal and wood, 500–2000 Hz fundamentals; no synth pads, no chimes-with-tails past 400 ms.<\u002Fli>\n    <li>Maximum one sound per user action; sequences never queue sounds.<\u002Fli>\n    <li>Haptics accompany state changes the finger caused — never ambient events.<\u002Fli>\n    <li>All sound respects the silent switch absolutely; haptics respect system settings.<\u002Fli>\n    <li>Sound and haptic fire on the same frame as the visual peak, ±1 frame.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 10 — Voice\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;10<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">LANGUAGE<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">10<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Voice &amp; Tone — The Concierge Register<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">AURUM speaks like a launch director crossed with a Geneva concierge: brief, exact, calm, never chummy, never robotic. Words are part of the metal.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(111,174,143,.3);border-radius:16px;padding:18px;background:rgba(111,174,143,.04)\">\n    <div style=\"font-size:9.5px;letter-spacing:.2em;color:#6FAE8F;font-weight:600;margin-bottom:12px\">✓ THE REGISTER<\u002Fdiv>\n    <div style=\"font-size:12px;line-height:2;color:#C2C4C8\">\n      “Saved.”<br>\n      “Transfer complete. $12,400.00 arrives Tuesday.”<br>\n      “Codes are 6 characters — this one is 5.”<br>\n      “Delete 4 reports? This cannot be undone.”<br>\n      “Welcome back, Commander.”\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(201,111,94,.3);border-radius:16px;padding:18px;background:rgba(201,111,94,.04)\">\n    <div style=\"font-size:9.5px;letter-spacing:.2em;color:#C96F5E;font-weight:600;margin-bottom:12px\">✕ COUNTERFEIT<\u002Fdiv>\n    <div style=\"font-size:12px;line-height:2;color:#8A8D93\">\n      “Awesome! Your stuff has been saved! 🎉”<br>\n      “Oops! Something went wrong.”<br>\n      “Invalid input detected in field DOCKING_CODE.”<br>\n      “Are you sure you want to do this?”<br>\n      “Hey there, superstar!”\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Sentence case everywhere including buttons; ALL-CAPS only in overline eyebrows.<\u002Fli>\n  <li>Verb-first actions (“Begin transfer”, not “Transfer initiation”); one idea per sentence; ≤12 words for interface copy.<\u002Fli>\n  <li>Errors: state what happened, then the fix — never blame, never apologize twice, never exclaim.<\u002Fli>\n  <li>Numbers stated precisely ($12,400.00, not “about $12k”); dates absolute past 48 h (“Mar 4”, not “23 days ago”).<\u002Fli>\n  <li>No emoji in chrome (06.1); no exclamation marks except a single one permitted at a peak moment.<\u002Fli>\n<\u002Ful>\n\n<div data-screen-label=\"Part 11 — Accessibility\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;11<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">UNIVERSAL<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">11<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Accessibility — Universal Luxury<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">A Rolex fits every wrist it is sized for; AURUM fits every human it reaches. Accessibility is a property of the metal, not an accommodation bolted on. These are release gates — a build that misses one does not ship.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px\">\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11.5px;color:#A7AAB0;line-height:1.85\">\n    <li>Contrast: 4.5:1 body, 3:1 large text and UI strokes (ledger 02.6); tested in both finishes.<\u002Fli>\n    <li>Type scales with Dynamic Type / browser zoom to 200% without loss of content or function; layouts reflow, never clip.<\u002Fli>\n    <li>Targets ≥44 px touch, ≥28 px pointer, 8 px separation (D-03).<\u002Fli>\n    <li>Focus: 2 px au.focus.ring, 2 px offset, on every focusable, keyboard order = reading order; no focus traps outside modals.<\u002Fli>\n    <li>Full keyboard grammar: ⇥ move, ␣/⏎ activate, ⎋ dismiss, arrows within composites (menus, segments, tables).<\u002Fli>\n  <\u002Ful>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11.5px;color:#A7AAB0;line-height:1.85\">\n    <li>Color never carries meaning alone — every status pairs hue with glyph or word (07.8 badges).<\u002Fli>\n    <li>Reduced motion: springs collapse to 120 ms crossfades; parallax, odometers, and ceremony choreography disable; nothing is lost, only the physics.<\u002Fli>\n    <li>Reduced transparency: Liquid Glass falls back to OB-100 at 96% (05.1).<\u002Fli>\n    <li>Screen readers: every control labeled, every image described or marked decorative, live regions announce async results (“Transfer complete”).<\u002Fli>\n    <li>Voice Control ready: visible labels match accessible names.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 12 — The Four Finishes\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;12<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">VARIATIONS<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">12<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">The Four Finishes<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">Like a watch case offered in four metals, AURUM ships in four accent finishes. Everything else — ramps, type, geometry, motion — is identical; only the 1% changes. One finish per product. Mixing finishes in one product is counterfeit.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(232,200,143,.4);border-radius:18px;overflow:hidden;background:#0C0C0F\">\n    <div style=\"height:76px;background:linear-gradient(120deg,#09090B 40%,rgba(232,200,143,.16));display:flex;align-items:center;justify-content:space-between;padding:0 18px\"><span style=\"font-size:15px;font-weight:700;color:#F5E7CC;letter-spacing:.06em\">AURUM GOLD<\u002Fspan><span style=\"height:34px;padding:0 20px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center\">Continue<\u002Fspan><\u002Fdiv>\n    <figcaption style=\"padding:14px 18px\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:5px\">ACCENT AU-300 #E8C88F · THE DEFAULT<\u002Fdiv><div style=\"font-size:10.5px;color:#A7AAB0;line-height:1.6\">Desert-gold on obsidian. Flagship products, finance, membership, anything ceremonial.<\u002Fdiv><\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.14);border-radius:18px;overflow:hidden;background:#0C0C0F\">\n    <div style=\"height:76px;background:linear-gradient(120deg,#09090B 40%,rgba(194,196,200,.14));display:flex;align-items:center;justify-content:space-between;padding:0 18px\"><span style=\"font-size:15px;font-weight:700;color:#F4F4F6;letter-spacing:.06em\">NATURAL Ti<\u002Fspan><span style=\"height:34px;padding:0 20px;border-radius:999px;background:linear-gradient(180deg,#E6E7EA,#C2C4C8);color:#141518;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center\">Continue<\u002Fspan><\u002Fdiv>\n    <figcaption style=\"padding:14px 18px\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#C2C4C8;margin-bottom:5px\">ACCENT TI-300 #C2C4C8 · THE TOOL<\u002Fdiv><div style=\"font-size:10.5px;color:#A7AAB0;line-height:1.6\">Pure instrument. Developer tools, consoles, pro utilities where even gold is too loud.<\u002Fdiv><\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(127,166,201,.35);border-radius:18px;overflow:hidden;background:#0C0C0F\">\n    <div style=\"height:76px;background:linear-gradient(120deg,#09090B 40%,rgba(127,166,201,.15));display:flex;align-items:center;justify-content:space-between;padding:0 18px\"><span style=\"font-size:15px;font-weight:700;color:#DCE8F2;letter-spacing:.06em\">GLACIER Ti<\u002Fspan><span style=\"height:34px;padding:0 20px;border-radius:999px;background:linear-gradient(180deg,#A9C6DF,#7FA6C9);color:#0D1620;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center\">Continue<\u002Fspan><\u002Fdiv>\n    <figcaption style=\"padding:14px 18px\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#7FA6C9;margin-bottom:5px\">ACCENT #7FA6C9 · THE LABORATORY<\u002Fdiv><div style=\"font-size:10.5px;color:#A7AAB0;line-height:1.6\">Cold-light blue. Health, science, telemetry — domains where warmth would mislead.<\u002Fdiv><\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(212,175,185,.35);border-radius:18px;overflow:hidden;background:#0C0C0F\">\n    <div style=\"height:76px;background:linear-gradient(120deg,#09090B 40%,rgba(212,175,185,.14));display:flex;align-items:center;justify-content:space-between;padding:0 18px\"><span style=\"font-size:15px;font-weight:700;color:#F2E4E8;letter-spacing:.06em\">ROSÉ Ti<\u002Fspan><span style=\"height:34px;padding:0 20px;border-radius:999px;background:linear-gradient(180deg,#E5C9D2,#D4AFB9);color:#211318;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center\">Continue<\u002Fspan><\u002Fdiv>\n    <figcaption style=\"padding:14px 18px\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#D4AFB9;margin-bottom:5px\">ACCENT #D4AFB9 · THE ATELIER<\u002Fdiv><div style=\"font-size:10.5px;color:#A7AAB0;line-height:1.6\">Everose warmth. Personal, editorial, and lifestyle surfaces; pairs with Pearl mode.<\u002Fdiv><\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fdiv>\n<div data-screen-label=\"Part 13 — Governance\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;13<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">LAW<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">13<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Governance — The Inspection<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">Every Rolex passes the Superlative Chronometer inspection; every AURUM release passes this one. Ten gates, checked on real hardware at 120 Hz, in both finishes, at 100% and 200% type scale. A failed gate stops the release — there is no “ship it and polish later,” because Law I says the polish is the product.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px\">\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-01<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">Every color, size, radius, duration resolves to a token in this standard. Zero raw values in review.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-02<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">One gold element per view (D-08). Screenshot-diff audit across all states.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-03<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">120 fps sustained on target hardware; no frame &gt;8.33 ms during any interaction (N-1 trace attached to release).<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-04<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">Input acknowledged ≤100 ms, resolved ≤400 ms or visibly accounted for (D-06).<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-05<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">Concentricity verified on every nested radius; capsules are true semicircles at rendered size.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-06<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">Contrast ledger re-run on final builds; all Part 11 gates green in both finishes.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-07<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">Reduced-motion and reduced-transparency paths exercised end-to-end; nothing lost but physics.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-08<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">Every flow's peak and end named in the spec and reviewed against D-07.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-09<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">Copy audit against Part 10; zero counterfeit register in strings.<\u002Fspan><\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;gap:14px;align-items:baseline;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;background:#0C0C0F\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F\">G-10<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.6\">The Squint Test: at arm's length, blurred, the view must still show one clear summit. If two things compete, return to bench.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"break-inside:avoid;border:1px solid rgba(232,200,143,.3);border-radius:16px;padding:18px 22px;background:linear-gradient(180deg,rgba(232,200,143,.06),rgba(232,200,143,.015));margin-bottom:26px\">\n  <div style=\"font-size:9.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin-bottom:8px\">AMENDMENTS<\u002Fdiv>\n  <p style=\"margin:0;font-size:11.5px;line-height:1.7;color:#C2C4C8\">The standard amends by edition, never by exception. A proposed change ships as a written case — the law it touches, the evidence, the cost of inconsistency (Law 14) — and takes effect only in the next edition. Between editions, the answer to “can we just this once” is the answer a watchmaker gives: no.<\u002Fp>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 14 — Application Specimens\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;14<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">PROOF<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">14<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Application<br>Specimens<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">Three complete screens assembled entirely from Parts 02–08, exactly as the reference builds of Edition 27 ship them: the Welcome ceremony, the Appearance settings sheet, and the Ascent flight HUD. Every value on these screens resolves to a token; nothing is drawn freehand. A standard that cannot furnish its own proof is a mood board.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center\">\n    <span style=\"font-size:9.5px;letter-spacing:.2em;color:#55575D\">SPECIMEN A · WELCOME — SPECIMEN B · APPEARANCE — SPECIMEN C · ASCENT HUD<\u002Fspan>\n    <span style=\"font-size:9.5px;letter-spacing:.2em;color:#55575D\">HANDHELD CLASS · 390×844 REFERENCE<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">14.1 — THE THREE PROOFS<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 14px\">Assembled from tokens alone.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:14px\">\n  <figure style=\"break-inside:avoid;margin:0;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"border-radius:34px;border:1px solid rgba(255,255,255,.14);background:#050506;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)\">\n      <div style=\"border-radius:27px;background:radial-gradient(120% 70% at 50% 30%,#131318,#09090B 70%);overflow:hidden;display:flex;flex-direction:column;height:4.55in;position:relative\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 18px 0\"><span style=\"font-size:9px;font-weight:600;color:#F4F4F6\">9:41<\u002Fspan><span style=\"width:56px;height:16px;border-radius:999px;background:#000;border:1px solid rgba(255,255,255,.1)\"><\u002Fspan><span style=\"display:flex;gap:3px;align-items:center\"><svg width=\"12\" height=\"9\" sc-camel-view-box=\"0 0 16 12\" fill=\"#F4F4F6\"><path d=\"M1 8.5h2.5V11H1zM4.8 6h2.5v5H4.8zM8.6 3.5h2.5V11H8.6zM12.4 1h2.5v10h-2.5z\"><\u002Fpath><\u002Fsvg><svg width=\"16\" height=\"9\" sc-camel-view-box=\"0 0 22 12\" fill=\"none\"><rect x=\".5\" y=\".5\" width=\"18\" height=\"11\" rx=\"3\" stroke=\"rgba(244,244,246,.5)\"><\u002Frect><rect x=\"2\" y=\"2\" width=\"12\" height=\"8\" rx=\"1.6\" fill=\"#F4F4F6\"><\u002Frect><path d=\"M20.5 4v4a2 2 0 000-4z\" fill=\"rgba(244,244,246,.5)\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px\">\n          <div style=\"width:52px;height:52px;border-radius:16px;background:linear-gradient(125deg,#F5E7CC 0%,#C2C4C8 38%,#F7EDD8 52%,#C89E63 78%,#8A6533 100%);box-shadow:0 4px 18px rgba(232,200,143,.25),inset 0 1px 0 rgba(255,255,255,.6);margin-bottom:18px\"><\u002Fdiv>\n          <div style=\"font-size:8px;letter-spacing:.26em;color:#7E8188;font-weight:600;margin-bottom:8px\">EDITION 27.0<\u002Fdiv>\n          <div style=\"font-size:21px;font-weight:700;letter-spacing:-.015em;color:#F4F4F6;line-height:1.15;margin-bottom:8px\">Welcome to<br>AURUM<\u002Fdiv>\n          <div style=\"font-size:10px;color:#A7AAB0;line-height:1.55;max-width:170px\">Four finishes, four hundred twelve tokens, one grammar.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 20px 18px;display:flex;flex-direction:column;gap:8px\">\n          <span style=\"height:40px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.45)\">Begin<\u002Fspan>\n          <span style=\"height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#F4F4F6;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center\">Restore<\u002Fspan>\n          <span style=\"width:96px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:6px auto 0\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:9.5px;color:#7E8188;line-height:1.6\"><span style=\"color:#E8C88F;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px\">SPECIMEN A · WELCOME<\u002Fspan><br>Ceremony surface: sp-10 breathing room, one G-1 sheen mark, one gold action (D-08), copy in the concierge register. Enter choreography: mark at t0, headline t+80, actions t+160 — spring.ceremony.<\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"border-radius:34px;border:1px solid rgba(255,255,255,.14);background:#050506;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.5)\">\n      <div style=\"border-radius:27px;background:#09090B;overflow:hidden;display:flex;flex-direction:column;height:4.55in\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:10px 18px 0\"><span style=\"font-size:9px;font-weight:600;color:#F4F4F6\">9:41<\u002Fspan><span style=\"width:56px;height:16px;border-radius:999px;background:#000;border:1px solid rgba(255,255,255,.1)\"><\u002Fspan><span style=\"font-size:8px;color:#A7AAB0\">100%<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:12px 16px 8px\"><div style=\"font-size:10px;color:#E8C88F;margin-bottom:2px\">‹ System<\u002Fdiv><div style=\"font-size:19px;font-weight:700;letter-spacing:-.015em;color:#F4F4F6\">Appearance<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin:4px 14px;border-radius:16px;background:#0C0C0F;border:1px solid rgba(255,255,255,.08)\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06)\"><span style=\"width:18px;height:18px;border-radius:6px;background:linear-gradient(180deg,#E6E7EA,#C2C4C8)\"><\u002Fspan><span style=\"font-size:11px;color:#F4F4F6;flex:1\">Natural Titanium<\u002Fspan><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.5 12.5l5 5 10-11\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06)\"><span style=\"width:18px;height:18px;border-radius:6px;background:linear-gradient(180deg,#26272E,#0C0C0F);border:1px solid rgba(255,255,255,.14)\"><\u002Fspan><span style=\"font-size:11px;color:#F4F4F6;flex:1\">Black Titanium<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px\"><span style=\"width:18px;height:18px;border-radius:6px;background:linear-gradient(180deg,#EDD3A2,#C89E63)\"><\u002Fspan><span style=\"font-size:11px x;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Stroke 9% + G-3 lumen<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Backdrop blur of any kind<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 16 — Menus &amp; Command\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;16<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">COMMAND<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">16<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Menus, Command &amp; Shortcuts<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">Menus are the drawer of instruments; the command palette is the crown — one press, any function. Both obey the same anatomy: label left, consequence right, destructive last and never adjacent to safe.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1.15fr;gap:14px;margin-bottom:16px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:radial-gradient(90% 120% at 50% 0%,#101014,#09090B);padding:22px;display:flex;align-items:center;justify-content:center\">\n    <div style=\"width:230px;border-radius:16px;background:rgba(22,22,26,.85);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 8px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);padding:6px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(232,200,143,.1)\"><span style=\"font-size:12px;color:#F4F4F6;font-weight:500\">Duplicate<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#7E8188\">⌘D<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px\"><span style=\"font-size:12px;color:#F4F4F6;font-weight:500\">Export tokens<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#7E8188\">⌘E<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px\"><span style=\"font-size:12px;color:#F4F4F6;font-weight:500\">Inspect<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#7E8188\">⌘I<\u002Fspan><\u002Fdiv>\n      <div style=\"height:1px;background:rgba(255,255,255,.08);margin:6px 4px\"><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px\"><span style=\"font-size:12px;color:#C96F5E;font-weight:500\">Delete<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#7E8188\">⌫<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffigure>\n  <ul style=\"break-inside:avoid;margin:0;padding:20px 20px 20px 36px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li>Menu container: r 16, Glass Deep at 85% opacity, E3, padding 6; rows 36 h, r 10, hover = gold tint 10% (never a blue bar).<\u002Fli>\n    <li>Row anatomy: label callout/500 left; shortcut SF Mono 10 TI-600 right; optional 16 px leading glyph. Submenu chevron TI-600, opens in 160 ms with 8 px offset.<\u002Fli>\n    <li>Groups split by hairline with 6 px padding; max 7 rows per group (D-02); destructive group always last, styled Oxide.<\u002Fli>\n    <li>Enter: scale .98→1 + fade, transform-origin at the invoking corner, spring.snappy. Exit 120 ms.<\u002Fli>\n    <li>Shortcut grammar: ⌘ primary · ⌥ variant · ⇧ amplified · ⌃ system. Single-key shortcuts only inside focused canvases (J/K navigation).<\u002Fli>\n    <li>Every menu action must also exist as a discoverable button or command — menus are accelerators, never the only path.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n<figure style=\"break-inside:avoid;margin:0 0 14px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:radial-gradient(90% 140% at 50% 0%,#101014,#09090B);padding:26px;display:flex;align-items:center;justify-content:center\">\n  <div style=\"width:100%;max-width:400px;border-radius:20px;background:rgba(16,16,20,.88);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 40px rgba(0,0,0,.55);overflow:hidden\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)\">\n      <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\u002Fcircle><path d=\"M20 20l-4.2-4.2\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font-size:13px;color:#F4F4F6\">sep<span style=\"display:inline-block;width:1.5px;height:14px;background:#E8C88F;margin-left:1px;vertical-align:-2px\"><\u002Fspan><\u002Fspan>\n      <span style=\"margin-left:auto;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#55575D;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:2px 6px\">ESC<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:6px\">\n      <div style=\"font-size:8.5px;letter-spacing:.2em;color:#55575D;padding:8px 12px 4px\">COMMANDS<\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(232,200,143,.1)\"><span style=\"font-size:12.5px;color:#F4F4F6\">Confirm second-stage <b style=\"color:#E8C88F;font-weight:600\">sep<\u002Fb>aration<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">⏎<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 12px\"><span style=\"font-size:12.5px;color:#C2C4C8\">Open <b style=\"color:#E8C88F;font-weight:600\">Sep<\u002Fb>tember review<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">⌘O<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 12px\"><span style=\"font-size:12.5px;color:#C2C4C8\">Set <b style=\"color:#E8C88F;font-weight:600\">sep<\u002Fb>arator style…<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffigure>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Command palette (⌘K): width 400–560, r 20, Glass Deep 88%, E4 over scrim-lite (40%); opens ≤80 ms with results already warm.<\u002Fli>\n  <li>Fuzzy matches highlight in gold weight-600 — the only bold inside a result row. Max 8 results before scroll; ranked by frecency.<\u002Fli>\n  <li>Selected row moves on arrow keys with the same gold-tint bar as menus; ⏎ executes; ⌘⏎ executes and keeps the palette open.<\u002Fli>\n  <li>Every destructive command inside the palette still routes through its confirmation dialog — the palette accelerates, never bypasses.<\u002Fli>\n<\u002Ful>\n\n<div data-screen-label=\"Part 17 — Notifications\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;17<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">SIGNALS<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">17<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Notifications &amp; Messaging<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">An interruption spends the user's attention; AURUM budgets it like gold. Four vessels, in rising order of cost: toast, banner, notification, blocking dialog. Each has one job, one lifespan, and one exit.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#09090B;padding:20px;display:flex;flex-direction:column;gap:12px;justify-content:center\">\n    <div style=\"display:flex;align-items:center;gap:10px;height:44px;border-radius:999px;background:rgba(22,22,26,.55);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 12px rgba(0,0,0,.4);padding:0 8px 0 14px\">\n      <span style=\"width:16px;height:16px;border-radius:50%;background:rgba(111,174,143,.18);display:inline-flex;align-items:center;justify-content:center\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6FAE8F\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.5 12.5l5 5 10-11\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span style=\"font-size:12px;color:#F4F4F6;flex:1\">Theme exported.<\u002Fspan>\n      <span style=\"height:30px;padding:0 14px;border-radius:999px;color:#E8C88F;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center\">Undo<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-radius:16px;background:rgba(22,22,26,.5);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);padding:12px 14px;display:flex;gap:12px;align-items:flex-start\">\n      <span style=\"width:30px;height:30px;border-radius:9px;background:linear-gradient(125deg,#F5E7CC,#C2C4C8 45%,#C89E63);flex:none\"><\u002Fspan>\n      <span style=\"flex:1\"><span style=\"display:flex;justify-content:space-between\"><span style=\"font-size:11.5px;font-weight:600;color:#F4F4F6\">Meridian<\u002Fspan><span style=\"font-size:9.5px;color:#7E8188\">now<\u002Fspan><\u002Fspan><span style=\"display:block;font-size:11px;color:#A7AAB0;line-height:1.5;margin-top:2px\">Window opens in 00:41. Confirm second-stage separation.<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:9.5px;color:#7E8188;line-height:1.6\">Toast (top) and notification card (bottom), both Glass Regular.<\u002Ffigcaption>\n  <\u002Ffigure>\n  <ul style=\"break-inside:avoid;margin:0;padding:20px 20px 20px 36px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li><b style=\"color:#F4F4F6;font-weight:600\">Toast<\u002Fb> — 44 h capsule, bottom-center, 4 s life, one optional action (gold text). Confirms what already happened; never asks.<\u002Fli>\n    <li><b style=\"color:#F4F4F6;font-weight:600\">Banner<\u002Fb> — full-width strip under the nav bar, r 0, tinted signal field 8%; persists until its condition clears; one action max.<\u002Fli>\n    <li><b style=\"color:#F4F4F6;font-weight:600\">Notification<\u002Fb> — r 16 glass card, icon 30 r 9, title + one line + relative time; groups by thread after 2; deep-links into context.<\u002Fli>\n    <li><b style=\"color:#F4F4F6;font-weight:600\">Blocking dialog<\u002Fb> — reserved for irreversible or safety-critical decisions (07.7). If it can wait, it must.<\u002Fli>\n    <li>Escalation is one-way: a toast may never become a dialog for the same event class without new user action.<\u002Fli>\n    <li>Batching: max 1 uninvited interruption per session per source; the rest accumulate in the tray with a TI-badge, silent.<\u002Fli>\n    <li>Every message answers: what happened · what changes · what can I do. Copy per Part 10, ≤2 lines at all sizes.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 18 — Data Visualization\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;18<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">TELEMETRY<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">18<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Data Visualization — Telemetry<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">Charts are instruments, not posters. One series earns gold; every other series is titanium. The data line is the brightest thing on the plot, the grid is nearly subliminal, and nothing is 3-D, ever.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:18px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px\"><span style=\"font-size:9px;letter-spacing:.2em;color:#7E8188\">DELTA-V BUDGET · 90 DAYS<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:15px;color:#F4F4F6;font-variant-numeric:tabular-nums\">9 441.7 <span style=\"font-size:9px;color:#6FAE8F\">▲ 2.1%<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <svg width=\"100%\" height=\"130\" sc-camel-view-box=\"0 0 440 130\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block\">\n      <line x1=\"0\" y1=\"32\" x2=\"440\" y2=\"32\" stroke=\"rgba(255,255,255,.05)\"><\u002Fline>\n      <line x1=\"0\" y1=\"64\" x2=\"440\" y2=\"64\" stroke=\"rgba(255,255,255,.05)\"><\u002Fline>\n      <line x1=\"0\" y1=\"96\" x2=\"440\" y2=\"96\" stroke=\"rgba(255,255,255,.05)\"><\u002Fline>\n      <path d=\"M0,108 C40,102 70,92 110,88 C150,84 180,72 220,66 C260,60 290,52 330,40 C370,30 410,24 440,18\" fill=\"none\" stroke=\"rgba(167,170,176,.4)\" stroke-width=\"1.2\" stroke-dasharray=\"3 4\"><\u002Fpath>\n      <path d=\"M0,116 C40,110 80,104 120,94 C160,84 200,80 240,68 C280,56 320,50 360,34 C395,22 420,16 440,12\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"2\"><\u002Fpath>\n      <path d=\"M0,116 C40,110 80,104 120,94 C160,84 200,80 240,68 C280,56 320,50 360,34 C395,22 420,16 440,12 L440,130 L0,130 Z\" fill=\"rgba(232,200,143,.06)\"><\u002Fpath>\n      <circle cx=\"360\" cy=\"34\" r=\"3.2\" fill=\"#E8C88F\" stroke=\"#09090B\" stroke-width=\"1.5\"><\u002Fcircle>\n    <\u002Fsvg>\n    <div style=\"display:flex;justify-content:space-between;margin-top:6px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#55575D\">MAY<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#55575D\">JUN<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#55575D\">JUL<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#55575D\">AUG<\u002Fspan><\u002Fdiv>\n    <figcaption style=\"margin-top:10px;font-size:9.5px;color:#7E8188;line-height:1.6\">Line: primary series AU-300 at 2 px; comparison TI-400 dashed 40%; area fill 6%; last point ringed. Gridlines 5% white, no axis strokes.<\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:18px;display:flex;flex-direction:column\">\n    <div style=\"font-size:9px;letter-spacing:.2em;color:#7E8188;margin-bottom:10px\">PROPELLANT ALLOCATION<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:9px\">\n      <div><div style=\"display:flex;justify-content:space-between;margin-bottom:4px\"><span style=\"font-size:10.5px;color:#C2C4C8\">Ascent<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA;font-variant-numeric:tabular-nums\">54%<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:3px;background:#1C1D22\"><span style=\"display:block;height:100%;width:54%;border-radius:3px;background:linear-gradient(90deg,#C89E63,#E8C88F)\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"display:flex;justify-content:space-between;margin-bottom:4px\"><span style=\"font-size:10.5px;color:#C2C4C8\">Circularization<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA;font-variant-numeric:tabular-nums\">27%<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:3px;background:#1C1D22\"><span style=\"display:block;height:100%;width:27%;border-radius:3px;background:#8A8D93\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"display:flex;justify-content:space-between;margin-bottom:4px\"><span style=\"font-size:10.5px;color:#C2C4C8\">Deorbit<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA;font-variant-numeric:tabular-nums\">12%<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:3px;background:#1C1D22\"><span style=\"display:block;height:100%;width:12%;border-radius:3px;background:#55575D\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"display:flex;justify-content:space-between;margin-bottom:4px\"><span style=\"font-size:10.5px;color:#C2C4C8\">Reserve<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA;font-variant-numeric:tabular-nums\">7%<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:3px;background:#1C1D22\"><span style=\"display:block;height:100%;width:7%;border-radius:3px;background:#33353D\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"margin-top:auto;padding-top:10px;font-size:9.5px;color:#7E8188;line-height:1.6\">Bars: 6 px tracks r 3; leader in gold gradient, others in descending titanium. Ranked, labeled, exact — no legend hunting.<\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fdiv>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Palette order for multi-series: AU-300 → TI-300 → TI-500 → TI-700 → Glacier. Never two golds; never red/green as series colors (they are verdicts, not categories).<\u002Fli>\n  <li>All figures SF Mono tabular; axis labels 8.5–10 px TI-700 uppercase; units stated once in the header, not per tick.<\u002Fli>\n  <li>Draw-in: lines trace left→right over t-entrance ×1.5 with spring.glide; bars grow from baseline stagger 40 ms; one draw per surface visit — never on tab return.<\u002Fli>\n  <li>Hover crosshair: 1 px TI-800 line + glass tooltip (M-1) with the full-precision value; touch shows a scrubbing lens.<\u002Fli>\n  <li>Empty plot = em-dash centered + one sentence; zero and missing are never conflated (07.9).<\u002Fli>\n  <li>Donuts only for ≤4 parts of a whole, 270° max sweep, figure in the bore; pie charts with legends are forbidden.<\u002Fli>\n<\u002Ful>\n\n<div data-screen-label=\"Part 19 — Forms II\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;19<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">INSTRUMENTS<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">19<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Forms II — Pickers &amp; Selection<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">The compound instruments: dropdowns, comboboxes, date pickers, and uploads. Each is a well (07.2) that opens into glass; the well states, focus halo, and error grammar are inherited verbatim.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:20px;display:flex;flex-direction:column;gap:16px\">\n    <div>\n      <div style=\"font-size:11px;font-weight:600;color:#C2C4C8;margin-bottom:6px\">Launch site<\u002Fdiv>\n      <div style=\"height:44px;border-radius:14px;background:#101014;border:1px solid #E8C88F;box-shadow:inset 0 1px 3px rgba(0,0,0,.35),0 0 0 3px rgba(232,200,143,.18);display:flex;align-items:center;justify-content:space-between;padding:0 14px\"><span style=\"font-size:13px;color:#F4F4F6\">Meridian Pad 39-A<\u002Fspan><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"margin-top:6px;border-radius:14px;background:rgba(22,22,26,.9);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.45);padding:5px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 11px;border-radius:10px;background:rgba(232,200,143,.1)\"><span style=\"font-size:12px;color:#F4F4F6\">Meridian Pad 39-A<\u002Fspan><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.5 12.5l5 5 10-11\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"padding:8px 11px;font-size:12px;color:#C2C4C8\">Vela Coastal Complex<\u002Fdiv>\n        <div style=\"padding:8px 11px;font-size:12px;color:#C2C4C8\">Corvus High Desert<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:9.5px;color:#7E8188;line-height:1.6\">Select: closed = well + chevron (TI-600, gold on focus); open = menu anatomy from 16.1, checkmark on current, opens under the well with 6 px gap, spring.snappy.<\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:20px;display:flex;flex-direction:column;gap:14px\">\n    <div>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A7AAB0\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><span style=\"font-size:12px;font-weight:600;color:#F4F4F6\">August 2126<\u002Fspan><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A7AAB0\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center\">\n        <span style=\"font-size:8px;color:#55575D;padding:3px 0\">M<\u002Fspan><span style=\"font-size:8px;color:#55575D;padding:3px 0\">T<\u002Fspan><span style=\"font-size:8px;color:#55575D;padding:3px 0\">W<\u002Fspan><span style=\"font-size:8px;color:#55575D;padding:3px 0\">T<\u002Fspan><span style=\"font-size:8px;color:#55575D;padding:3px 0\">F<\u002Fspan><span style=\"font-size:8px;color:#55575D;padding:3px 0\">S<\u002Fspan><span style=\"font-size:8px;color:#55575D;padding:3px 0\">S<\u002Fspan>\n        <span style=\"font-size:10px;color:#7E8188;padding:5px 0\">1<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0\">2<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0\">3<\u002Fspan><span style=\"font-size:10px;color:#1A1206;background:linear-gradient(180deg,#EDD3A2,#D9B279);border-radius:999px;padding:5px 0;font-weight:700\">4<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0;background:rgba(232,200,143,.12);border-radius:999px 0 0 999px\">5<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0;background:rgba(232,200,143,.12)\">6<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0;background:rgba(232,200,143,.12);border-radius:0 999px 999px 0\">7<\u002Fspan>\n        <span style=\"font-size:10px;color:#C2C4C8;padding:5px 0\">8<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0\">9<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0\">10<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0\">11<\u002Fspan><span style=\"font-size:10px;color:#C2C4C8;padding:5px 0\">12<\u002Fspan><span style=\"font-size:10px;color:#7E8188;padding:5px 0\">13<\u002Fspan><span style=\"font-size:10px;color:#7E8188;padding:5px 0\">14<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:9.5px;color:#7E8188;line-height:1.6\">Calendar: today = gold capsule (the view's one gold, D-08); range = au.selection band with capsule ends; weekends TI-600; day cells 28 px min, arrows are 28 px circle targets.<\u002Ffigcaption>\n    <div style=\"border:1.5px dashed rgba(255,255,255,.18);border-radius:14px;padding:16px;text-align:center\">\n      <div style=\"font-size:11.5px;color:#C2C4C8;font-weight:500;margin-bottom:2px\">Drop flight plan here<\u002Fdiv>\n      <div style=\"font-size:9.5px;color:#7E8188\">or <span style=\"color:#E8C88F;font-weight:600\">browse<\u002Fspan> · .fpln up to 200 MB<\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"font-size:9.5px;color:#7E8188;line-height:1.6\">Upload: dashed 1.5 px well, r 14; drag-over = gold dash + 6% gold field; while uploading, the well becomes its own determinate bar (07.8) with filename and a cancel ✕.<\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fdiv>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Combobox = search capsule + select menu; typing filters with gold-bold matches (16.2); no result renders “No matches — press ⏎ to add” when creation is allowed.<\u002Fli>\n  <li>Multi-select renders chosen items as chips inside the well (07.4), wrapping to 2 rows then “+N”.<\u002Fli>\n  <li>Time is two steppers (07.3) plus a segmented AM/PM — never a spinning drum on desktop; handheld may use the platform wheel (D-05).<\u002Fli>\n  <li>Forms submit on ⏎ from any field when valid; the primary capsule shows the loading orbital (07.1) and the form locks against double-submit.<\u002Fli>\n<\u002Ful>\n\n<div data-screen-label=\"Part 20 — Onboarding &amp; Ceremony\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;20<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">CEREMONY<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">20<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Onboarding &amp; Ceremony<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">The unboxing, scripted. First run is the one guaranteed peak (D-07) — it earns t-ceremony, the Chrome strike, and the largest whitespace stop in the system. Everything after it must be faster than the user expects.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:20px\">\n    <div style=\"font-size:9.5px;letter-spacing:.2em;color:#E8C88F;font-weight:600;margin-bottom:12px\">THE FIRST-RUN SCRIPT — FIVE BEATS<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <div style=\"display:flex;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F;width:30px\">B-1<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.55\"><b style=\"color:#F4F4F6;font-weight:600\">Arrival.<\u002Fb> Void canvas, Chrome mark blooms over 700 ms, headline sets. No buttons for the first beat — let it land.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F;width:30px\">B-2<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.55\"><b style=\"color:#F4F4F6;font-weight:600\">One promise.<\u002Fb> A single sentence of value in the concierge register. Never a feature carousel (D-15: one message per screen).<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F;width:30px\">B-3<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.55\"><b style=\"color:#F4F4F6;font-weight:600\">The ask.<\u002Fb> At most two decisions (finish, sign-in) with smart defaults preselected (D-12). Progress opens at “1 of 5 — done” (D-10).<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F;width:30px\">B-4<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.55\"><b style=\"color:#F4F4F6;font-weight:600\">First success.<\u002Fb> The user completes one real action inside 60 seconds; the interface answers with the E5 ceremony card — the peak.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:14px;padding:9px 0\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#E8C88F;width:30px\">B-5<\u002Fspan><span style=\"font-size:11.5px;color:#C2C4C8;line-height:1.55\"><b style=\"color:#F4F4F6;font-weight:600\">Release.<\u002Fb> Chrome never appears again in the session. The system goes quiet and fast — the watch is on the wrist now.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;display:flex;flex-direction:column;gap:14px\">\n    <div style=\"border:1px solid rgba(232,200,143,.35);border-radius:16px;background:linear-gradient(160deg,rgba(232,200,143,.09),rgba(232,200,143,.02) 60%),#0D0D10;box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 40px rgba(232,200,143,.06);padding:20px;text-align:center\">\n      <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 26 26\" fill=\"none\" style=\"margin-bottom:10px\"><path d=\"M13 1L25 13L13 25L1 13Z\" stroke=\"#E8C88F\" stroke-width=\"1\"><\u002Fpath><circle cx=\"13\" cy=\"13\" r=\"1.4\" fill=\"#E8C88F\"><\u002Fcircle><\u002Fsvg>\n      <div style=\"font-size:16px;font-weight:700;color:#F5E7CC;margin-bottom:4px\">First orbit complete.<\u002Fdiv>\n      <div style=\"font-size:11px;color:#D6C6A5;margin-bottom:14px\">Telemetry is live. Your bench is ready, Commander.<\u002Fdiv>\n      <span style=\"height:36px;padding:0 22px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:12px;font-weight:600;display:inline-flex;align-items:center\">Enter the bench<\u002Fspan>\n    <\u002Fdiv>\n    <ul style=\"margin:0;padding:16px 16px 16px 32px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n      <li>Ceremony budget: one E5 card, one t-ceremony, one soft-success haptic, one struck note — all in the same beat, then never again in the flow.<\u002Fli>\n      <li>Skippable always: a quiet “Skip” in TI-600 top-right; skipping is remembered and never re-asked.<\u002Fli>\n      <li>Every ending states the next beginning (“Enter the bench”) — endings are doors, not walls (D-07).<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div data-screen-label=\"Part 21 — Web &amp; Marketing\" style=\"break-before:page;break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;21<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">STAGE<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">21<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Web &amp; Marketing Surfaces<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">The stage obeys the same physics as the bench, at larger scale: one act per viewport, scroll as the timeline, and the igloo doctrine — the page is one continuous material, not a stack of banners.<\u002Fp>\n<\u002Fdiv>\n<figure style=\"break-inside:avoid;margin:0 0 14px;border:1px solid rgba(255,255,255,.09);border-radius:18px;overflow:hidden;background:radial-gradient(130% 90% at 50% 0%,#121218 0%,#09090B 55%)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.07)\">\n    <span style=\"display:flex;align-items:center;gap:8px\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 26 26\" fill=\"none\"><path d=\"M13 1L25 13L13 25L1 13Z\" stroke=\"#E8C88F\" stroke-width=\"1.4\"><\u002Fpath><\u002Fsvg><span style=\"font-size:11px;font-weight:700;letter-spacing:.14em;color:#F4F4F6\">AURUM<\u002Fspan><\u002Fspan>\n    <span style=\"display:flex;gap:20px\"><span style=\"font-size:10.5px;color:#A7AAB0\">Standard<\u002Fspan><span style=\"font-size:10.5px;color:#A7AAB0\">Editions<\u002Fspan><span style=\"font-size:10.5px;color:#A7AAB0\">Foundry<\u002Fspan><\u002Fspan>\n    <span style=\"height:30px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center\">Request access<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"text-align:center;padding:52px 30px 56px\">\n    <div style=\"font-size:9px;letter-spacing:.4em;color:#E8C88F;font-weight:600;margin-bottom:16px\">EDITION 27 · MERIDIAN<\u002Fdiv>\n    <div style=\"font-size:44px;font-weight:700;letter-spacing:-.025em;line-height:1.04;color:#F4F4F6;margin-bottom:16px\">The interface,<br><span style=\"background:linear-gradient(118deg,#E8E1D2,#C7C9CD 16%,#F6F3EA 32%,#CBC7BE 46%,#EBCD90 62%,#D3A45B 78%,#C9A25C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">machined.<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:13px;color:#A7AAB0;max-width:380px;margin:0 auto 24px;line-height:1.6\">Four finishes, four hundred twelve tokens, one grammar. Drafted for the next century of software.<\u002Fdiv>\n    <div style=\"display:inline-flex;gap:10px\"><span style=\"height:44px;padding:0 26px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.45)\">Read the standard<\u002Fspan><span style=\"height:44px;padding:0 26px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#F4F4F6;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center\">Watch the film<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <figcaption style=\"display:flex;justify-content:space-between;padding:12px 22px;border-top:1px solid rgba(255,255,255,.07)\">\n    <span style=\"font-size:9px;color:#7E8188;letter-spacing:.12em\">HERO ANATOMY — EYEBROW · HEADLINE (1 CHROME WORD MAX) · ONE PROMISE · TWO ACTIONS<\u002Fspan>\n    <span style=\"font-size:9px;color:#7E8188;letter-spacing:.12em\">SCROLL CUE, NOT CAROUSEL<\u002Fspan>\n  <\u002Ffigcaption>\n<\u002Ffigure>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>One act per viewport: each 100 vh section makes one claim with one proof; acts separated by sp-9, never by decorative dividers.<\u002Fli>\n  <li>Scroll choreography: content enters at 15% viewport intersection (translateY 24→0, spring.glide, stagger 40 ms); each act animates once, never re-triggers.<\u002Fli>\n  <li>Scrolljacking is forbidden; parallax within the 0.85× / 40 px budget (08.2); a pinned scene may hold at most 1.5 viewport-heights.<\u002Fli>\n  <li>Type scale doubles on the stage: hero display up to 96 px desktop / 44 px handheld, tracking −2.4%; body never exceeds 17 px.<\u002Fli>\n  <li>Pricing tables: 3 tiers max, the recommended tier is the one gold object on the page; feature lists ≤7 rows (D-02) with a “Compare all” disclosure.<\u002Fli>\n  <li>Footer is a quiet instrument: OB-000 field, hairline top, columns of TI-400 links in callout size; the wordmark sets in Chrome exactly once here.<\u002Fli>\n<\u002Ful>\n\n<div data-screen-label=\"Part 22 — Platforms\" style=\"break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;22<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">ADAPTATION<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">22<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Platform Adaptations<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin:0 0 18px;max-width:6.4in\">One grammar, four bodies. Tokens are constant across platforms; only densities, input physics, and chrome placement adapt. A user moving between devices should feel the same watch on a different strap.<\u002Fp>\n<\u002Fdiv>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:11px;margin:0 0 14px\">\n  <sc-raw-thead><sc-raw-tr>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">SURFACE<\u002Fsc-raw-th>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">HANDHELD break-inside:avoid\">\n<div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px;margin-bottom:26px\">\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;25<\u002Fspan>\n  <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">RECORD<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:baseline;gap:22px;margin-bottom:14px\">\n  <span style=\"font-size:64px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30)\">25<\u002Fspan>\n  <h1 style=\"font-size:34px;font-weight:700;letter-spacing:-0.02em;color:#F4F4F6;margin:0\">Glossary &amp; The Record<\u002Fh1>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"columns:2;column-gap:26px;font-size:11px;line-height:1.7;margin-bottom:18px\">\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Bench<\u002Fb> — <span style=\"color:#A7AAB0\">any working surface of an AURUM product; the opposite of the Stage (marketing).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Capsule Law<\u002Fb> — <span style=\"color:#A7AAB0\">all buttons are r 999 with true semicircular ends (07.1).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Ceremony<\u002Fb> — <span style=\"color:#A7AAB0\">the once-per-flow peak treatment: E5, t-ceremony, one haptic, one note (D-07, Part 20).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Chrome (M-4)<\u002Fb> — <span style=\"color:#A7AAB0\">the silver-to-gold mirror alloy; one strike per product (15).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Concentricity<\u002Fb> — <span style=\"color:#A7AAB0\">inner radius = outer radius − inset (04.2).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Counterfeit<\u002Fb> — <span style=\"color:#A7AAB0\">any surface that borrows AURUM's look while violating a law; named so reviews can say it plainly.<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Finish<\u002Fb> — <span style=\"color:#A7AAB0\">one of four accent metals (12); constant per product.<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Frame contract<\u002Fb> — <span style=\"color:#A7AAB0\">the 8.33 ms budget every animation signs (N-1).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Machined edge<\u002Fb> — <span style=\"color:#A7AAB0\">1 px stroke + 1 px inner-top light on every raised surface (05.3).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Peak / End<\u002Fb> — <span style=\"color:#A7AAB0\">the two moments a flow is remembered by; both are declared in spec (D-07).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Summit<\u002Fb> — <span style=\"color:#A7AAB0\">the single most important element of a view; the Squint Test finds it (G-10).<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">The 1%<\u002Fb> — <span style=\"color:#A7AAB0\">gold's maximum share of any screen (02.4); the currency rule.<\u002Fspan><\u002Fp>\n  <p style=\"margin:0 0 10px;break-inside:avoid\"><b style=\"color:#E8C88F;font-weight:600\">Well<\u002Fb> — <span style=\"color:#A7AAB0\">a recessed input surface: OB-150, inset shadow, r 14 (07.2).<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<div style=\"break-inside:avoid;border:1px solid rgba(232,200,143,.3)
