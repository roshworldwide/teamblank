 style=\"margin:0;font-size:11.5px;color:#A7AAB0;line-height:1.65\">90% of screen area is the neutral field: canvas, surfaces, and titanium text. 9% is structural articulation: hairlines, elevated surfaces, glass. 1% is Aurum Gold: the primary action, the key figure, or the active state — never more than one of these at once (D-08). When everything else is metal, one square centimeter of gold outshines a screenful of color.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">02.5 — GRADIENTS &amp; SHEEN<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Light on metal, never dye.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:14px;overflow:hidden;background:#0C0C0F\">\n    <div style=\"height:64px;background:linear-gradient(118deg,#E8E1D2 0%,#C7C9CD 16%,#F6F3EA 32%,#CBC7BE 46%,#EBCD90 62%,#D3A45B 76%,#96703D 90%,#C9A25C 100%)\"><\u002Fdiv>\n    <figcaption style=\"padding:12px 14px\"><div style=\"font-size:11px;color:#F4F4F6;font-weight:600\">G-1 · Signature Sheen — silver into gold<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6;margin-top:4px\">118° · E8E1D2 → C7C9CD 16% → F6F3EA 32% → CBC7BE 46% → EBCD90 62% → D3A45B 76% → 96703D 90% → C9A25C<\u002Fdiv><div style=\"font-size:9.5px;color:#A7AAB0;margin-top:6px;line-height:1.5\">Wordmarks, hero numerals, award moments. Max once per surface.<\u002Fdiv><\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:14px;overflow:hidden;background:#0C0C0F\">\n    <div style=\"height:64px;background:linear-gradient(180deg,#EDD3A2,#D9B279)\"><\u002Fdiv>\n    <figcaption style=\"padding:12px 14px\"><div style=\"font-size:11px;color:#F4F4F6;font-weight:600\">G-2 · Action Gold<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6;margin-top:4px\">180° · EDD3A2 → D9B279<\u002Fdiv><div style=\"font-size:9.5px;color:#A7AAB0;margin-top:6px;line-height:1.5\">Primary buttons and active controls. 12% luminance travel — enough to read as machined, not enough to read as plastic.<\u002Fdiv><\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:14px;overflow:hidden;background:#0C0C0F\">\n    <div style=\"height:64px;background:linear-gradient(180deg,#0D0D10,#0A0A0C)\"><\u002Fdiv>\n    <figcaption style=\"padding:12px 14px\"><div style=\"font-size:11px;color:#F4F4F6;font-weight:600\">G-3 · Surface Lumen<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6;margin-top:4px\">180° · 0D0D10 → 0A0A0C<\u002Fdiv><div style=\"font-size:9.5px;color:#A7AAB0;margin-top:6px;line-height:1.5\">Card interiors. A 2-step fall that implies overhead light; invisible when noticed, dead-flat when removed.<\u002Fdiv><\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fdiv>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.4in\">\n  <li>Permitted angles: 115° (sheen) and 180° (lighting). No radial fills except the 120%-radius ambient glow at ≤9% alpha.<\u002Fli>\n  <li>Gradients travel within one ramp. Cross-ramp gradients (gold→blue) are counterfeit AURUM.<\u002Fli>\n  <li>Text is never gradient-filled below 48 px — legibility outranks jewelry.<\u002Fli>\n<\u002Ful>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">02.6 — CONTRAST LEDGER<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Every pairing, audited.<\u002Fh2>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:11px;margin:0 0 8px\">\n  <sc-raw-thead><sc-raw-tr>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">PAIR<\u002Fsc-raw-th>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">RATIO<\u002Fsc-raw-th>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">GRADE<\u002Fsc-raw-th>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">CLEARED FOR<\u002Fsc-raw-th>\n  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n  <sc-raw-tbody>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">TI-100 on OB-050<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">17.5 : 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#6FAE8F\">AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">All text, all sizes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">TI-300 on OB-050<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">11.2 : 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#6FAE8F\">AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Body, long-form reading<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">TI-400 on OB-050<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">8.4 : 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#6FAE8F\">AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Secondary text<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">TI-600 on OB-050<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">5.5 : 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#D98E41\">AA<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Captions ≥12 px, metadata<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#E8C88F\">AU-300 on OB-050<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">12.3 : 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#6FAE8F\">AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Accent text, links, figures<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">#1A1206 on Action Gold<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">11.6 : 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#6FAE8F\">AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Primary button labels<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">PE-900 on PE-000<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">16.3 : 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#6FAE8F\">AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Light-mode text, all sizes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#C2C4C8\">AU-700 on PE-000<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px;color:#D6D7DA\">5.1 : 1<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#D98E41\">AA<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Light-mode accent text ≥12 px<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<p style=\"margin:0 0 24px;font-size:10.5px;color:#7E8188;max-width:6.4in\">Ratios per WCAG 2.2 relative luminance. Floor: 4.5:1 body, 3:1 large text (≥24 px) and UI strokes. Gold never carries body text on Pearl below 12 px; TI-700 and below are non-text tones.<\u002Fp>\n<div data-screen-label=\"Part 03 — Typography\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;03<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">FOUNDATION<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">03<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Typography —<br>The Voice in Metal<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">One typeface, thirteen calibrated sizes, four weights. SF Pro is the entire vocal range of AURUM — engraved large and quiet, or small and precise. Hierarchy is built from weight and tone before size; scale is the instrument of last resort.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid rgba(255,255,255,.08);padding-top:20px\">\n    <span style=\"font-size:64px;font-weight:700;letter-spacing:-.02em;color:#F4F4F6\">Aa<\u002Fspan>\n    <span style=\"font-size:64px;font-weight:600;letter-spacing:-.015em;color:#C2C4C8\">Aa<\u002Fspan>\n    <span style=\"font-size:64px;font-weight:500;letter-spacing:-.01em;color:#A7AAB0\">Aa<\u002Fspan>\n    <span style=\"font-size:64px;font-weight:400;color:#7E8188\">Aa<\u002Fspan>\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:44px;font-weight:500;color:#E8C88F\">01<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">03.1 — THE TYPEFACE DOCTRINE<\u002Fdiv>\n<h2 style=\"font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 14px\">SF Pro. Nothing else touches the glass.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:0 0 16px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-size:9.5px;letter-spacing:.2em;color:#7E8188;margin-bottom:8px\">PRIMARY<\u002Fdiv>\n    <div style=\"font-size:15px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">SF Pro<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#A7AAB0;line-height:1.6\">Display optical size at ≥20 px (tighter apertures, negative tracking); Text optical size below 20 px (open apertures, generous spacing). The system applies the switch automatically; never fight it manually.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-size:9.5px;letter-spacing:.2em;color:#7E8188;margin-bottom:8px\">DATA<\u002Fdiv>\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:14px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">SF Mono<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#A7AAB0;line-height:1.6\">Serial numbers, coordinates, hashes, code, token values. Weight 500 at 85–90% of the surrounding text size. Never for prose.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-size:9.5px;letter-spacing:.2em;color:#7E8188;margin-bottom:8px\">LICENSED ALTERNATE<\u002Fdiv>\n    <div style=\"font-size:15px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Google Sans<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#A7AAB0;line-height:1.6\">Permitted only where SF Pro cannot be licensed (non-Apple hardware). Same scale, tracking reduced by 0.2% across the board to compensate for its wider fit. Never mix the two in one product.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 18px;background:#0C0C0F;margin:0 0 24px\">\n  <div style=\"font-size:9px;letter-spacing:.18em;color:#E8C88F;font-weight:600;margin-bottom:6px\">RENDERING STACK<\u002Fdiv>\n  <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10.5px;color:#A7AAB0;line-height:1.7\">font-family: -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", \"Google Sans\", \"Helvetica Neue\", sans-serif;<br>-webkit-font-smoothing: antialiased; &nbsp;text-rendering: optimizeLegibility; &nbsp;font-variant-numeric: tabular-nums lining-nums; /* data surfaces */<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">03.2 — THE SCALE<\u002Fdiv>\n<h2 style=\"font-size:26px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 14px\">Thirteen registers, geometrically stepped (D-13).<\u002Fh2>\n<\u002Fdiv>\n<figure style=\"break-inside:avoid;margin:0 0 10px;border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden;background:#0C0C0F\">\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Colossus<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">76 / 80 · 700 · −2.0%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:76px;line-height:1;font-weight:700;letter-spacing:-.02em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Meridian<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Display<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">56 / 62 · 700 · −1.5%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:56px;line-height:1.1;font-weight:700;letter-spacing:-.015em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Machined light<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Title 1<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">40 / 46 · 700 · −1.0%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-.01em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Precision as a feeling<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Title 2<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">32 / 38 · 600 · −0.5%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:32px;line-height:1.19;font-weight:600;letter-spacing:-.005em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Section heads carry the argument<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Title 3<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">24 / 30 · 600 · −0.3%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.003em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Panel and modal titles hold this register<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Headline<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">19 / 24 · 600 · −0.1%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:19px;line-height:1.26;font-weight:600;color:#F4F4F6\">Card titles and row headers — the workhorse emphasis size<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Body<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">17 / 26 · 400 · 0<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:17px;line-height:1.53;font-weight:400;color:#C2C4C8\">Default reading register. Paragraphs measure 45–72 characters; anything wider is a layout defect, not a preference.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Callout<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">15 / 22 · 400 · 0<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:15px;line-height:1.47;font-weight:400;color:#C2C4C8\">Dense UI prose: list descriptions, settings explanations, table cells.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Subheadline<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">14 / 20 · 500 · +0.1%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.43;font-weight:500;color:#C2C4C8\">Secondary emphasis inside compact components — chips, menu items.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Footnote<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">13 / 18 · 400 · +0.1%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:13px;line-height:1.38;font-weight:400;color:#A7AAB0\">Helper text under inputs, legal-adjacent notes, timestamps.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Caption<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">12 / 16 · 400 · +0.2%<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:12px;line-height:1.33;font-weight:400;color:#A7AAB0\">Image credits, axis labels, tertiary metadata. Floor for TI-600 ink.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:11px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Label<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">11 / 13 · 600 · +6% · CAPS<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:11px;line-height:1.18;font-weight:600;letter-spacing:.06em;color:#A7AAB0\">SECTION LABELS, TAB TITLES, COLUMN HEADERS<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.35in 1fr;gap:16px;align-items:baseline;padding:11px 20px\">\n    <div><div style=\"font-size:10.5px;color:#F4F4F6;font-weight:600\">Micro<\u002Fdiv><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:8.5px;color:#7E8188;line-height:1.6\">10 / 12 · 600 · +12% · CAPS<\u002Fdiv><\u002Fdiv>\n    <div style=\"font-size:10px;line-height:1.2;font-weight:600;letter-spacing:.12em;color:#E8C88F\">OVERLINES · UNITS · SERIAL DESIGNATIONS — THE ENGRAVED REGISTER<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffigure>\n<p style=\"margin:0 0 24px;font-size:10.5px;color:#7E8188;max-width:6.6in\">Absolute floor 10 px, and only for the two caps registers. Weights permitted: 400, 500, 600, 700. Ultralight and Thin (≤300) are reserved for numerals ≥56 px, where their hairline strokes read as engraving rather than frailty.<\u002Fp>\n\n<div style=\"break-before:page;font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">03.3 — NUMERALS &amp; DATA SETTING<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Numbers are instrumentation.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:20px\">\n    <div style=\"font-size:9px;letter-spacing:.18em;color:#E8C88F;font-weight:600;margin-bottom:12px\">TABULAR LINING — ALWAYS, IN ANY COLUMN<\u002Fdiv>\n    <div style=\"font-variant-numeric:tabular-nums lining-nums;font-size:26px;font-weight:600;color:#F4F4F6;line-height:1.5\">\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:12px;font-weight:400;color:#7E8188;align-self:center\">Altitude<\u002Fspan><span>124,801<span style=\"font-size:13px;color:#7E8188\">&nbsp;m<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:12px;font-weight:400;color:#7E8188;align-self:center\">Velocity<\u002Fspan><span>7,668<span style=\"font-size:13px;color:#7E8188\">&nbsp;m/s<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;color:#E8C88F\"><span style=\"font-size:12px;font-weight:400;color:#7E8188;align-self:center\">Apogee<\u002Fspan><span>99.984<span style=\"font-size:13px;color:#7E8188\">&nbsp;%<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0;font-size:10.5px;color:#7E8188;line-height:1.6\">Digits share one advance width so columns never shiver as values tick. Units set at 50% size, TI-600, thin space before.<\u002Fp>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:20px\">\n    <div style=\"font-size:9px;letter-spacing:.18em;color:#E8C88F;font-weight:600;margin-bottom:12px\">CHUNKED IDENTIFIERS (D-04)<\u002Fdiv>\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:19px;font-weight:500;color:#F4F4F6;letter-spacing:.04em\">4021 · 8846 · 0917 · 2126<\u002Fdiv>\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:11px;color:#A7AAB0;margin-top:10px\">SN&nbsp;AU-M1-000047 &nbsp;·&nbsp; LOT&nbsp;79-XII<\u002Fdiv>\n    <p style=\"margin:14px 0 0;font-size:10.5px;color:#7E8188;line-height:1.6\">Codes group in fours with interpuncts or thin spaces; SF Mono 500; copy-on-tap mandatory. A number a human must transcribe is a defect.<\u002Fp>\n  <\u002Ffigure>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">03.4 — SETTING RULES<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">The compositor's law.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:26px\">\n  <div style=\"break-inside:avoid;padding:14px 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0C0C0F\"><div style=\"font-size:11.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Hierarchy order: tone → weight → size<\u002Fdiv><p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">Demote with TI-400/TI-600 first, then weight, and only then a smaller register. Two adjacent sizes never differ by less than 2 px.<\u002Fp><\u002Fdiv>\n  <div style=\"break-inside:avoid;padding:14px 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0C0C0F\"><div style=\"font-size:11.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Tracking follows size<\u002Fdiv><p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">Negative above 20 px (−0.3% to −2%), neutral at body, positive below 14 px. All-caps always +6% to +12%. Never track lowercase prose.<\u002Fp><\u002Fdiv>\n  <div style=\"break-inside:avoid;padding:14px 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0C0C0F\"><div style=\"font-size:11.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Paragraph mechanics<\u002Fdiv><p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">Space between paragraphs = 0.75× line-height; no first-line indents in UI. Headings bind to their content: space-above ≥ 2× space-below.<\u002Fp><\u002Fdiv>\n  <div style=\"break-inside:avoid;padding:14px 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0C0C0F\"><div style=\"font-size:11.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Punctuation is finished<\u002Fdiv><p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">True quotes “ ”, apostrophes ’, en dashes for ranges, em dashes unspaced, ellipsis character (…). Straight quotes in shipped UI fail inspection.<\u002Fp><\u002Fdiv>\n  <div style=\"break-inside:avoid;padding:14px 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0C0C0F\"><div style=\"font-size:11.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Optical alignment<\u002Fdiv><p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">Large headlines hang quotes and round glyphs 1–2 px past the margin; icon + label pairs align to cap height, not bounding box.<\u002Fp><\u002Fdiv>\n  <div style=\"break-inside:avoid;padding:14px 16px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#0C0C0F\"><div style=\"font-size:11.5px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">Wrapping<\u002Fdiv><p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">Headings: text-wrap balance. Body: text-wrap pretty. No manual line breaks in translatable strings; truncation is single-line ellipsis with full value on press.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div data-screen-label=\"Part 03 — Typography\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;03<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">FOUNDATION<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">03<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Typography —<br>The Voice in Metal<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">One family: SF Pro. Display above 20 px, Text at and below, Mono for telemetry. The scale is engraved — nine sizes, four weights, exact tracking per size. There is no second typeface, and there never will be.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid rgba(255,255,255,.08);padding-top:18px\">\n    <span style=\"font-size:64px;font-weight:700;letter-spacing:-.02em;color:#F4F4F6\">Aa<\u002Fspan>\n    <span style=\"font-size:64px;font-weight:600;letter-spacing:-.015em;color:#C2C4C8\">Aa<\u002Fspan>\n    <span style=\"font-size:64px;font-weight:500;letter-spacing:-.01em;color:#A7AAB0\">Aa<\u002Fspan>\n    <span style=\"font-size:64px;font-weight:400;letter-spacing:0;color:#7E8188\">Aa<\u002Fspan>\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:44px;font-weight:500;color:#E8C88F\">0123<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">03.1 — THE FAMILY<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">SF Pro, three cuts, four weights.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px 18px;background:#0C0C0F\">\n    <div style=\"font-size:26px;font-weight:700;letter-spacing:-.02em;color:#F4F4F6;margin-bottom:8px\">SF Pro Display<\u002Fdiv>\n    <p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">&gt;20 px. Headlines, key figures, numerals. Tighter apertures tuned for large sizes. Fallback chain: <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px\">-apple-system, 'Helvetica Neue', 'Google Sans', sans-serif<\u002Fspan>.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px 18px;background:#0C0C0F\">\n    <div style=\"font-size:15px;font-weight:500;color:#F4F4F6;margin-bottom:8px;line-height:1.75\">SF Pro Text — ≤20 px. Body, labels, captions. Wider apertures and looser default tracking keep small sizes open.<\u002Fdiv>\n    <p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">Weights permitted: 400 / 500 / 600 / 700 only. Ultralight and Black are reserved for brand films, never UI.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:16px 18px;background:#0C0C0F\">\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:500;color:#E8C88F;margin-bottom:8px\">SF Mono — 004.217<\u002Fdiv>\n    <p style=\"margin:0;font-size:10.5px;color:#A7AAB0;line-height:1.6\">Telemetry, coordinates, token names, hashes, code. Always tabular. On non-Apple platforms: <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px\">ui-monospace, 'Roboto Mono', Menlo<\u002Fspan>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">03.2 — THE ENGRAVED SCALE<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Nine sizes. No tenth.<\u002Fh2>\n<p style=\"margin:0 0 14px;max-width:6.4in\">Geometric progression ≈1.2 (D-13), 4 px line-height grid. Tracking follows the SF optical-size curve: tighter as size rises. Every row below is set in its own spec.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;overflow:hidden;margin-bottom:20px\">\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:10px 18px;border-bottom:1px solid rgba(232,200,143,.25)\">\n    <span style=\"font-size:8.5px;letter-spacing:.16em;color:#E8C88F;font-weight:600\">STYLE<\u002Fspan><span style=\"font-size:8.5px;letter-spacing:.16em;color:#E8C88F;font-weight:600\">SIZE/LH<\u002Fspan><span style=\"font-size:8.5px;letter-spacing:.16em;color:#E8C88F;font-weight:600\">WEIGHT<\u002Fspan><span style=\"font-size:8.5px;letter-spacing:.16em;color:#E8C88F;font-weight:600\">TRACK<\u002Fspan><span style=\"font-size:8.5px;letter-spacing:.16em;color:#E8C88F;font-weight:600\">SPECIMEN — SET IN ITS OWN SPEC<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.06);align-items:baseline;padding-top:15px;padding-bottom:15px\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">display-xl<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">64/68<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">700<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">−2.4%<\u002Fspan><span style=\"font-size:36px;line-height:1.3;font-weight:700;letter-spacing:-.024em;color:#F4F4F6;white-space:nowrap\">Meridian 27<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.06);align-items:baseline\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">display-l<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">48/52<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">700<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">−2.2%<\u002Fspan><span style=\"font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.022em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Titanium, machined<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.06);align-items:baseline\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">display-m<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">34/40<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">700<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">−1.8%<\u002Fspan><span style=\"font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.018em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Section titles, sheet headers<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.06);align-items:baseline\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">title<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">24/30<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">600<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">−1.4%<\u002Fspan><span style=\"font-size:20px;line-height:1.2;font-weight:600;letter-spacing:-.014em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Card titles and dialog headlines<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.06);align-items:baseline\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">headline<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">18/24<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">600<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">−0.8%<\u002Fspan><span style=\"font-size:16px;line-height:1.3;font-weight:600;letter-spacing:-.008em;color:#F4F4F6;white-space:nowrap;overflow:hidden\">Row headlines, emphasized body lead-ins<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.06);align-items:baseline\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">body<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">15/22<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">400<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">−0.2%<\u002Fspan><span style=\"font-size:14px;line-height:1.45;font-weight:400;letter-spacing:-.002em;color:#C2C4C8;white-space:nowrap;overflow:hidden\">The reading size. Default for all prose, forms, and lists.<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.06);align-items:baseline\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">callout<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">13/18<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">500<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">0<\u002Fspan><span style=\"font-size:12.5px;line-height:1.4;font-weight:500;color:#C2C4C8;white-space:nowrap;overflow:hidden\">Button labels, tab labels, field labels, dense table cells<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.06);align-items:baseline\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">caption<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">12/16<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">400<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">+0.6%<\u002Fspan><span style=\"font-size:11.5px;line-height:1.4;font-weight:400;letter-spacing:.006em;color:#A7AAB0;white-space:nowrap;overflow:hidden\">Timestamps, metadata, helper text under fields<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.12in .62in .62in .62in 1fr;gap:0;padding:12px 18px;align-items:baseline\"><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#D6D7DA\">overline<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">11/14<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">600<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">+18%<\u002Fspan><span style=\"font-size:10px;line-height:1.4;font-weight:600;letter-spacing:.18em;color:#E8C88F;white-space:nowrap;overflow:hidden\">SECTION EYEBROWS · ALWAYS GOLD<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">03.3 — NUMERALS &amp; RULES OF SETTING<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Numbers are instruments.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:24px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;background:#0C0C0F\">\n    <div style=\"font-size:9.5px;letter-spacing:.18em;color:#7E8188;margin-bottom:14px\">TABULAR LINING — MANDATORY IN DATA<\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-size:12px;color:#A7AAB0\">Stage separation<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:15px;color:#F4F4F6;font-variant-numeric:tabular-nums\">T+00:02:47.219<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)\"><span style=\"font-size:12px;color:#A7AAB0\">Downrange<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:15px;color:#F4F4F6;font-variant-numeric:tabular-nums\">00,094.6 km<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:7px 0\"><span style=\"font-size:12px;color:#A7AAB0\">Balance<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:15px;color:#E8C88F;font-variant-numeric:tabular-nums\">$1,284,900.00<\u002Fspan><\u002Fdiv>\n    <p style=\"margin:12px 0 0;font-size:10.5px;color:#7E8188;line-height:1.6\">Columns of digits align because every digit shares one advance width (<span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px\">font-variant-numeric: tabular-nums<\u002Fspan>). Proportional figures are permitted only inside prose.<\u002Fp>\n  <\u002Fdiv>\n  <ul style=\"break-inside:avoid;margin:0;padding:20px 20px 20px 36px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11.5px;color:#A7AAB0;line-height:1.85\">\n    <li>Line length 45–75 characters; 66 is the target.<\u002Fli>\n    <li>Rag right always; justification is forbidden (rivers read as neglect).<\u002Fli>\n    <li>One weight jump per pairing: 400 pairs with 600, never with 700.<\u002Fli>\n    <li>True apostrophes and quotes (’ “ ”); en-dash for ranges; hairline-spaced × for dimensions.<\u002Fli>\n    <li>ALL-CAPS only in overline style, tracked +18%; never bold-caps body.<\u002Fli>\n    <li>No underlines except hover on inline prose links.<\u002Fli>\n    <li>Ellipsis is the character …, never three periods.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n<div data-screen-label=\"Part 04 — Space &amp; Geometry\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;04<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">FOUNDATION<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">04<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Space, Grid<br>&amp; Geometry<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">Everything sits on a 4-point lattice. Corners are concentric like a watch case; capsules are true semicircles; whitespace is a purchased material, budgeted per surface. Geometry is inherited, never invented (Law IV).<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:8px;align-items:flex-end\">\n    <div style=\"width:16px;height:16px;background:rgba(232,200,143,.25);border:1px solid rgba(232,200,143,.5)\"><\u002Fdiv>\n    <div style=\"width:24px;height:24px;background:rgba(232,200,143,.2);border:1px solid rgba(232,200,143,.45)\"><\u002Fdiv>\n    <div style=\"width:32px;height:32px;background:rgba(232,200,143,.16);border:1px solid rgba(232,200,143,.4)\"><\u002Fdiv>\n    <div style=\"width:48px;height:48px;background:rgba(232,200,143,.12);border:1px solid rgba(232,200,143,.35)\"><\u002Fdiv>\n    <div style=\"width:64px;height:64px;background:rgba(232,200,143,.08);border:1px solid rgba(232,200,143,.3)\"><\u002Fdiv>\n    <div style=\"width:96px;height:96px;background:rgba(232,200,143,.05);border:1px solid rgba(232,200,143,.25)\"><\u002Fdiv>\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188;margin-left:10px;padding-bottom:2px\">4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">04.1 — THE SPACING SCALE<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Ten stops. White
