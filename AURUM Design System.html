nlo,monospace;font-size:10px;color:#A7AAB0\">auto / 24<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">1280 · reading 720<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.4in\">\n  <li>Content never touches a viewport edge except full-bleed media and the Liquid Glass bars.<\u002Fli>\n  <li>Reading columns cap at 720 px regardless of viewport (Part 03 line-length law).<\u002Fli>\n  <li>Optical alignment outranks mathematical alignment: icons and capsules align by visual mass, ±1 px allowed, and that pixel is deliberate.<\u002Fli>\n<\u002Ful>\n<div data-screen-label=\"Part 05 — Materials\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;05<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">FOUNDATION<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">05<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Materials &amp; Depth —<br>Liquid Glass<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">AURUM builds with three materials: machined titanium (opaque surfaces), Liquid Glass (translucent chrome that bends the content behind it), and light itself (hairlines, sheens, shadows). No wood, no leather, no photographs of metal — material is rendered by optics, not texture.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:relative;height:150px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:linear-gradient(120deg,#101014 0%,#1C1D22 30%,#0C0C0F 60%,#26272E 100%)\">\n    <div style=\"position:absolute;left:10%;top:8%;width:120px;height:120px;border-radius:60px;background:radial-gradient(circle,rgba(232,200,143,.22),transparent 70%)\"><\u002Fdiv>\n    <div style=\"position:absolute;right:14%;bottom:-20%;width:180px;height:120px;border-radius:90px;background:radial-gradient(circle,rgba(127,166,201,.13),transparent 70%)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:26px 22%;border-radius:999px;background:rgba(22,22,26,.42);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:26px\">\n      <span style=\"font-size:11px;letter-spacing:.14em;color:#F4F4F6;font-weight:600\">GLASS BAR<\u002Fspan>\n      <span style=\"width:1px;height:20px;background:rgba(255,255,255,.16)\"><\u002Fspan>\n      <span style=\"font-size:11px;letter-spacing:.14em;color:#A7AAB0\">BLUR 14 · SAT 1.6 · WHITE 14%<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">05.1 — LIQUID GLASS RECIPES<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Three pours. Exact formulas.<\u002Fh2>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:11px;margin:0 0 14px\">\n  <sc-raw-thead><sc-raw-tr>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">MATERIAL<\u002Fsc-raw-th>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">FORMULA (DARK)<\u002Fsc-raw-th>\n    <sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">USED FOR<\u002Fsc-raw-th>\n  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n  <sc-raw-tbody>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Glass Thin<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#A7AAB0\">bg rgba(22,22,26,.32) · blur 8 · saturate 1.4 · stroke rgba(255,255,255,.10) · inner-top rgba(255,255,255,.10)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Chips, segmented controls, tooltips<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Glass Regular<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#A7AAB0\">bg rgba(22,22,26,.42) · blur 14 · saturate 1.6 · stroke rgba(255,255,255,.14) · inner-top rgba(255,255,255,.14)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Nav bars, tab bars, floating toolbars<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#F4F4F6;font-weight:600\">Glass Deep<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#A7AAB0\">bg rgba(16,16,20,.55) · blur 22 · saturate 1.8 · stroke rgba(255,255,255,.16) · inner-top rgba(255,255,255,.18)<\u002Fsc-raw-td><sc-raw-td style=\"padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);color:#A7AAB0\">Modals, sheets, command palette<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<ul style=\"margin:0 0 22px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Glass floats only over content — never glass on glass (one membrane per z-column).<\u002Fli>\n  <li>Text on glass: TI-100 primary only; secondary text moves to TI-300 (thin glass cannot guarantee 8:1 for TI-400).<\u002Fli>\n  <li>Pearl-mode remap: bg rgba(251,251,252,.55/.65/.75), stroke rgba(28,29,34,.10), inner-top rgba(255,255,255,.7).<\u002Fli>\n  <li>Where <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px\">backdrop-filter<\u002Fspan> is unavailable, fall back to OB-100 at 96% opacity — never skip the stroke and inner light.<\u002Fli>\n<\u002Ful>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">05.2 — ELEVATION LADDER<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Six altitudes. Shadows double per level (D-13).<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px\">\n  <div style=\"break-inside:avoid;border-radius:16px;padding:16px;background:#09090B;border:1px solid rgba(255,255,255,.08)\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:5px\">E0 · CANVAS<\u002Fdiv><div style=\"font-size:11px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">The bench<\u002Fdiv><div style=\"font-size:9.5px;color:#7E8188;line-height:1.55\">No shadow. OB-050. Everything rests here.<\u002Fdiv><\u002Fdiv>\n  <div style=\"break-inside:avoid;border-radius:16px;padding:16px;background:linear-gradient(180deg,#0D0D10,#0A0A0C);border:1px solid rgba(255,255,255,.08);box-shadow:0 1px 2px rgba(0,0,0,.3)\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:5px\">E1 · RESTING CARD<\u002Fdiv><div style=\"font-size:11px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">0 1 2 / 30%<\u002Fdiv><div style=\"font-size:9.5px;color:#7E8188;line-height:1.55\">Cards, tiles, list containers. Hairline does most of the work.<\u002Fdiv><\u002Fdiv>\n  <div style=\"break-inside:avoid;border-radius:16px;padding:16px;background:linear-gradient(180deg,#0E0E11,#0B0B0D);border:1px solid rgba(255,255,255,.1);box-shadow:0 2px 4px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.25)\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:5px\">E2 · RAISED<\u002Fdiv><div style=\"font-size:11px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">0 2 4 / 35% + 0 4 12 / 25%<\u002Fdiv><div style=\"font-size:9.5px;color:#7E8188;line-height:1.55\">Hover lift, dragged rows, dropdowns.<\u002Fdiv><\u002Fdiv>\n  <div style=\"break-inside:avoid;border-radius:16px;padding:16px;background:#101014;border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 8px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:5px\">E3 · FLOATING<\u002Fdiv><div style=\"font-size:11px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">0 4 8 / 40% + 0 8 24 / 30%<\u002Fdiv><div style=\"font-size:9.5px;color:#7E8188;line-height:1.55\">Popovers, toasts, floating action clusters.<\u002Fdiv><\u002Fdiv>\n  <div style=\"break-inside:avoid;border-radius:16px;padding:16px;background:#101014;border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 16px rgba(0,0,0,.45),0 16px 48px rgba(0,0,0,.35)\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:5px\">E4 · MODAL<\u002Fdiv><div style=\"font-size:11px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">0 8 16 / 45% + 0 16 48 / 35%<\u002Fdiv><div style=\"font-size:9.5px;color:#7E8188;line-height:1.55\">Dialogs, sheets. Rides above the scrim.<\u002Fdiv><\u002Fdiv>\n  <div style=\"break-inside:avoid;border-radius:16px;padding:16px;background:#121217;border:1px solid rgba(232,200,143,.25);box-shadow:0 12px 24px rgba(0,0,0,.5),0 24px 64px rgba(0,0,0,.4),0 0 48px rgba(232,200,143,.07)\"><div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:5px\">E5 · CEREMONY<\u002Fdiv><div style=\"font-size:11px;color:#F4F4F6;font-weight:600;margin-bottom:4px\">E4 ×1.5 + gold ambience 7%<\u002Fdiv><div style=\"font-size:9.5px;color:#7E8188;line-height:1.55\">Peak moments only (D-07): success, unveil, award.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0 0 22px;font-size:10.5px;color:#7E8188;max-width:6.4in\">Shadows are always neutral black — never colored, except the E5 gold ambience. Light source is fixed at 90° overhead; every inner-top highlight and every G-3 gradient obeys the same sun.<\u002Fp>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">05.3 — HAIRLINES &amp; THE MACHINED EDGE<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">The edge is the finish.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"height:64px;border-radius:14px;background:linear-gradient(180deg,#111116,#0C0C0F);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center\"><span style=\"font-size:10px;letter-spacing:.12em;color:#A7AAB0\">STROKE 8–14% WHITE + INNER-TOP LIGHT<\u002Fspan><\u002Fdiv>\n    <p style=\"margin:12px 0 0;font-size:10.5px;color:#A7AAB0;line-height:1.65\">Every raised surface carries a 1 px stroke and a 1 px inner-top highlight — the chamfer catching overhead light. This pair, not the shadow, is what reads as machining.<\u002Fp>\n  <\u002Fdiv>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li>Hairlines are 1 px at every density (0.5 px on 3× displays).<\u002Fli>\n    <li>Dividers stop 16 px short of container edges in inset lists; full-bleed only between full-bleed rows.<\u002Fli>\n    <li>Never two hairlines within 4 px — merge or remove one.<\u002Fli>\n    <li>Gold hairlines (25% AU-300) are reserved for the active/selected edge and section eyebrows.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div style=\"break-before:page\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">05.4 — LIQUID GLASS OPTICS, IN FULL<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">The complete physics of the membrane.<\u002Fh2>\n<p style=\"margin:0 0 16px;max-width:6.4in\">Liquid Glass is not a blur filter; it is a lens with mass. Five optical behaviors define it, and all five must be present for a surface to call itself glass. A blur without its edge light is fog; AURUM does not ship fog.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:6px\">OPTIC 1 · REFRACTION<\u002Fdiv>\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">The backdrop bends, brighter and richer<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#A7AAB0;line-height:1.65\">Blur radius per pour (8/14/22) with saturation lift (1.4/1.6/1.8) — content behind glass reads MORE vivid, not grayer. The lens concentrates the world; it never deadens it. Blur radii are fixed per pour, never animated.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:6px\">OPTIC 2 · THE MENISCUS<\u002Fdiv>\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Edge light on two sides<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#A7AAB0;line-height:1.65\">1 px outer stroke (10–16% white) + 1 px inner-top highlight (10–18%) from the fixed 90° sun, and a 1 px inner-bottom shade at 20% black on Deep. This pair is the surface tension that makes the pane read as liquid rather than tinted rectangle.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:6px\">OPTIC 3 · ADAPTIVE DENSITY<\u002Fdiv>\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Glass thickens over busy light<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#A7AAB0;line-height:1.65\">The membrane samples its backdrop: when mean backdrop luminance exceeds 40% or local contrast is high (imagery, video), fill alpha rises +10% and the stroke +4% so labels never fall below their ledger ratios. Adaptation eases over t-standard — never per-frame flicker.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:6px\">OPTIC 4 · MASS<\u002Fdiv>\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">The membrane responds like a control<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#A7AAB0;line-height:1.65\">Pressed glass compresses to scale .985 (bars are heavier than buttons); dragged glass carries momentum and rubber-bands; a dismissed pane exits through the same physics it entered (spring.gentle). Glass never crossfades away — membranes move, they don't evaporate.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px;background:#0C0C0F\">\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:6px\">OPTIC 5 · THE SWEEP<\u002Fdiv>\n    <div style=\"font-size:13px;color:#F4F4F6;font-weight:600;margin-bottom:6px\">Specular life, strictly rationed<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#A7AAB0;line-height:1.65\">During scroll, a 118° specular band (8% white, 120 px wide) may traverse a bar once, velocity-linked, ≤1 sweep per 800 ms. At rest the sweep is dead — N-3 forbids ambient shimmer. This is the one permitted trace of theater in the metal.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"break-inside:avoid;border:1px solid rgba(232,200,143,.3);border-radius:16px;padding:18px;background:rgba(232,200,143,.04)\">\n    <div style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9px;color:#E8C88F;margin-bottom:6px\">SIZE CLASSES — WHICH POUR, WHEN<\u002Fdiv>\n    <p style=\"margin:0;font-size:11px;color:#C2C4C8;line-height:1.75\">Elements ≤40 px tall → <b style=\"font-weight:600\">Thin<\u002Fb> (chips, tooltips, segmented). 40–88 px chrome → <b style=\"font-weight:600\">Regular<\u002Fb> (nav, tab, toolbars, toasts). Overlays above the scrim → <b style=\"font-weight:600\">Deep<\u002Fb> (dialogs, sheets, palette). Bigger than the viewport's third → not glass at all: use Obsidian Solid (M-5); reading surfaces are never translucent.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px\">\n  <ul style=\"break-inside:avoid;margin:0;padding:16px 16px 16px 32px;border:1px solid rgba(111,174,143,.28);border-radius:14px;background:rgba(111,174,143,.04);font-size:11px;color:#C2C4C8;line-height:1.8\">\n    <li>One membrane per z-column — glass floats over content, never over glass (05.1).<\u002Fli>\n    <li>Text on glass: TI-100 primary, TI-300 secondary, gold only for the one accent; figures stay SF Mono tabular.<\u002Fli>\n    <li>Corners obey concentricity; a capsule bar's interior controls derive their radius from the capsule (r-inset).<\u002Fli>\n    <li>Reduced-transparency and unsupported engines: OB-100 at 96% + the full meniscus — the edge light is non-negotiable even when the blur is gone.<\u002Fli>\n    <li>Print/PDF: glass renders as its fallback fill; the sweep and refraction do not exist on paper.<\u002Fli>\n  <\u002Ful>\n  <ul style=\"break-inside:avoid;margin:0;padding:16px 16px 16px 32px;border:1px solid rgba(201,111,94,.28);border-radius:14px;background:rgba(201,111,94,.04);font-size:11px;color:#C2C4C8;line-height:1.8\">\n    <li>✕ Glass on glass, glass wells, translucent input interiors.<\u002Fli>\n    <li>✕ Body text or dense tables on any pour — reading happens on Solid.<\u002Fli>\n    <li>✕ Animated blur radius (frame-budget killer, G-03) — animate position and opacity only.<\u002Fli>\n    <li>✕ Colored or gold-tinted glass fills; tint belongs to the backdrop, not the lens.<\u002Fli>\n    <li>✕ Fog: any blur missing its stroke + inner light + shadow is counterfeit glass and fails inspection.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n<div data-screen-label=\"Part 06 — Iconography\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;06<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">FOUNDATION<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">06<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Iconography<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">Icons are engraved instrument markings, not illustrations. One stroke weight, one grid, optical alignment to SF Pro's cap height. When SF Symbols exist for a concept, they are used; new glyphs are drawn to the same physics.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:22px;align-items:center;border-top:1px solid rgba(255,255,255,.08);padding-top:20px\">\n    <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F4F4F6\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3.5 2\"><\u002Fpath><\u002Fsvg>\n    <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F4F4F6\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19V6.5A2.5 2.5 0 016.5 4h11A2.5 2.5 0 0120 6.5V19\"><\u002Fpath><path d=\"M2 19h20\"><\u002Fpath><path d=\"M9 9h6\"><\u002Fpath><\u002Fsvg>\n    <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F4F4F6\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l2.4 6.2L21 9.6l-5 4.2 1.6 6.4L12 16.8 6.4 20.2 8 13.8 3 9.6l6.6-.4z\"><\u002Fpath><\u002Fsvg>\n    <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2L2 19h20z\"><\u002Fpath><path d=\"M12 9v5\"><\u002Fpath><circle cx=\"12\" cy=\"16.4\" r=\".2\" fill=\"#E8C88F\"><\u002Fcircle><\u002Fsvg>\n    <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F4F4F6\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><\u002Fsvg>\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188;margin-left:auto\">24 GRID · 1.5 STROKE · ROUND CAPS<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">06.1 — CONSTRUCTION RULES<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">One physics for every glyph.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px\">\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11.5px;color:#A7AAB0;line-height:1.85\">\n    <li>Grid 24×24; live area 20×20; 2 px protection zone all round.<\u002Fli>\n    <li>Stroke 1.5 px at 24; scales to 1.25 at 16–20 and 2 at 32–40. Never mixed weights in one glyph.<\u002Fli>\n    <li>Round caps, round joins, 2 px internal corner radius — the machined fillet.<\u002Fli>\n    <li>Optical sizes: 16 (inline), 20 (controls), 24 (default), 32 (feature), 40 (ceremony). Icons never scale arbitrarily; each size is drawn or snapped.<\u002Fli>\n    <li>Filled variants exist only for the active state of navigation glyphs.<\u002Fli>\n  <\u002Ful>\n  <ul style=\"break-inside:avoid;margin:0;padding:18px 18px 18px 34px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11.5px;color:#A7AAB0;line-height:1.85\">\n    <li>Color: icons inherit text color of their row — TI-100 beside primary text, TI-400 beside secondary. Gold icons only inside the one gold element (D-08).<\u002Fli>\n    <li>Alignment: center of glyph mass to cap-height center of adjacent label, gap sp-2.<\u002Fli>\n    <li>Metaphor budget: one metaphor per glyph. A cloud with an arrow and a clock is three icons welded together — redraw.<\u002Fli>\n    <li>No emoji in interface chrome, ever. Emoji live only in user-generated content.<\u002Fli>\n    <li>Every icon-only control carries an <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px\">aria-label<\u002Fspan> and a 300 ms-delay tooltip.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n<div data-screen-label=\"Part 07 — Components\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;07<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">THE INSTRUMENT PANEL<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">07<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Components —<br>The Instrument Panel<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">Every part of the machine, rendered live from its own specification: buttons, fields, controls, cards, navigation, overlays, status, and data. Each carries exact dimensions, states, and motion bindings. If a component is not in this part, it does not exist in AURUM.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:10px;align-items:center\">\n    <span style=\"height:44px;padding:0 26px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:13px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 6px rgba(0,0,0,.4)\">Primary<\u002Fspan>\n    <span style=\"height:44px;padding:0 26px;border-radius:999px;background:rgba(22,22,26,.42);border:1px solid rgba(255,255,255,.14);color:#F4F4F6;font-size:13px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)\">Secondary<\u002Fspan>\n    <span style=\"height:44px;padding:0 20px;border-radius:999px;color:#E8C88F;font-size:13px;font-weight:600;display:inline-flex;align-items:center\">Tertiary<\u002Fspan>\n    <span style=\"width:44px;height:26px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);display:inline-flex;align-items:center;justify-content:flex-end;padding:0 3px;box-sizing:border-box;margin-left:auto\"><span style=\"width:20px;height:20px;border-radius:50%;background:#FBFBFC;box-shadow:0 1px 3px rgba(0,0,0,.4)\"><\u002Fspan><\u002Fspan>\n    <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#7E8188\">CAPSULE LAW · R=999<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">07.1 — BUTTONS<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">The Capsule Law.<\u002Fh2>\n<p style=\"margin:0 0 14px;max-width:6.5in\">All buttons are capsules — radius 999, a true semicircular end. Rectangular buttons do not exist in AURUM. Three ranks, three sizes, one gold per view (D-08). Label style: <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10.5px;color:#D6D7DA\">callout 13/18 · 600<\u002Fspan>, sentence case, verb-first.<\u002Fp>\n<div style=\"border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:20px;margin-bottom:14px\">\n  <div style=\"display:grid;grid-template-columns:.9in 1fr 1fr 1fr 1fr;gap:12px;align-items:center;margin-bottom:6px\">\n    <span><\u002Fspan><span style=\"font-size:8.5px;letter-spacing:.16em;color:#7E8188;text-align:center\">REST<\u002Fspan><span style=\"font-size:8.5px;letter-spacing:.16em;color:#7E8188;text-align:center\">HOVER (−1 PX LIFT)<\u002Fspan><span style=\"font-size:8.5px;letter-spacing:.16em;color:#7E8188;text-align:center\">PRESSED (0.97)<\u002Fspan><span style=\"font-size:8.5px;letter-spacing:.16em;color:#7E8188;text-align:center\">DISABLED (40%)<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9in 1fr 1fr 1fr 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)\">\n    <span style=\"font-size:9.5px;letter-spacing:.1em;color:#E8C88F;font-weight:600\">PRIMARY<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 6px rgba(0,0,0,.4)\">Continue<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:linear-gradient(180deg,#F1DCB4,#DDB983);color:#1A1206;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.45);transform:translateY(-1px)\">Continue<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:linear-gradient(180deg,#DDBB85,#C89E63);color:#1A1206;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 2px rgba(0,0,0,.15);transform:scale(.97)\">Continue<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;opacity:.4\">Continue<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9in 1fr 1fr 1fr 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)\">\n    <span style=\"font-size:9.5px;letter-spacing:.1em;color:#A7AAB0;font-weight:600\">SECONDARY<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:rgba(22,22,26,.42);border:1px solid rgba(255,255,255,.14);color:#F4F4F6;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)\">Preview<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:rgba(28,28,34,.55);border:1px solid rgba(255,255,255,.2);color:#F4F4F6;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.16);transform:translateY(-1px)\">Preview<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:rgba(38,39,46,.6);border:1px solid rgba(255,255,255,.16);color:#F4F4F6;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;transform:scale(.97)\">Preview<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:rgba(22,22,26,.42);border:1px solid rgba(255,255,255,.14);color:#F4F4F6;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;opacity:.4\">Preview<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:.9in 1fr 1fr 1fr 1fr;gap:12px;align-items:center;padding:10px 0 2px;border-top:1px solid rgba(255,255,255,.06)\">\n    <span style=\"font-size:9.5px;letter-spacing:.1em;color:#A7AAB0;font-weight:600\">DESTRUCT.<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:rgba(201,111,94,.12);border:1px solid rgba(201,111,94,.4);color:#C96F5E;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center\">Delete<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:rgba(201,111,94,.2);border:1px solid rgba(201,111,94,.55);color:#D98A7A;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;transform:translateY(-1px)\">Delete<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:#C96F5E;color:#1A0C09;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;transform:scale(.97)\">Delete<\u002Fspan>\n    <span style=\"justify-self:center;height:40px;padding:0 22px;border-radius:999px;background:rgba(201,111,94,.12);border:1px solid rgba(201,111,94,.4);color:#C96F5E;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;opacity:.4\">Delete<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:11px;margin:0 0 14px\">\n  <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">SIZE<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bottom:1px solid rgba(232,200,143,.3)\">HEIGHT<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left;padding:8px 10px;font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;border-bott ess behavior (D-16): scale 0.97 + shadow collapse on <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px\">pointerdown<\u002Fspan> within 1 frame; release springs back with motion token <span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:10px\">spring.snappy<\u002Fspan>.<\u002Fli>\n  <li>Loading: label fades to 0 over 80 ms; 16 px orbital spinner (gold on dark surfaces, #1A1206 on gold) fades in; width is locked — a button never changes size while working.<\u002Fli>\n  <li>Icon-only buttons are circles (44/32); destructive confirmation always demands a second, differently-placed press.<\u002Fli>\n<\u002Ful>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">07.2 — INPUTS &amp; FORMS<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Fields are recessed wells in the metal.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n  <div style=\"break-inside:avoid;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;background:#0C0C0F;display:flex;flex-direction:column;gap:14px\">\n    <div>\n      <div style=\"font-size:11px;font-weight:600;color:#C2C4C8;margin-bottom:6px;letter-spacing:.01em\">Full name<\u002Fdiv>\n      <div style=\"height:44px;border-radius:14px;background:#101014;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 3px rgba(0,0,0,.35);display:flex;align-items:center;padding:0 14px\"><span style=\"font-size:13px;color:#55575D\">Amelia Vance<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:10.5px;color:#7E8188;margin-top:5px\">Rest — stroke 14%, inset shadow, placeholder TI-700.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:11px;font-weight:600;color:#E8C88F;margin-bottom:6px;letter-spacing:.01em\">Call sign<\u002Fdiv>\n      <div style=\"height:44p "font-size:9px;letter-spacing:.16em;color:#7E8188\">SLIDER · TRACK 4 · THUMB 24<\u002Fdiv>\n    <div style=\"position:relative;height:24px;display:flex;align-items:center\"><span style=\"position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#26272E\"><\u002Fspan><span style=\"position:absolute;left:0;width:62%;height:4px;border-radius:2px;background:linear-gradient(90deg,#C89E63,#E8C88F)\"><\u002Fspan><span style=\"position:absolute;left:62%;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#FBFBFC;box-shadow:0 1px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8)\"><\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px\"><span style=\"height:32px;display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.14);border-radius:999px;overflow:hidden\"><span style=\"width:36px;text-align:center;color:#F4F4F6;font-size:15px;border-right:1px solid rgba(255,255,255,.1)\">−<\u002Fspan><span style=\"width:44px;text-align:center;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12px;color:#F4F4F6;font-variant-numeric:tabular-nums\">04<\u002Fspan><span style=\"width:36px;text-align:center;color:#F4F4F6;font-size:15px;border-left:1px solid rgba(255,255,255,.1)\">+<\u002Fspan><\u002Fspan><span style=\"font-size:11px;color:#7E8188\">Stepper capsule · 32 h<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:9.5px;color:#7E8188;line-height:1.55\">Filled track is the only permitted gold gradient in controls. Thumb grows to 28 px while dragging; value bubble appears above after 150 ms hold. Detents tick haptically every 10%.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">07.4 — SEGMENTED CONTROL &amp; CHIPS<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:20px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-bottom:24px\">\n  <span style=\"display:inline-flex;background:rgba(22,22,26,.6);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px\">\n    <span style=\"height:32px;padding:0 18px;border-radius:999px;background:#33353D;color:#F4F4F6;font-size:12px;font-weight:600;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 3px rgba(0,0,0,.4)\">Orbit<\u002Fspan>\n    <span style=\"height:32px;padding:0 18px;border-radius:999px;color:#A7AAB0;font-size:12px;font-weight:500;display:inline-flex;align-items:center\">Transit<\u002Fspan>\n    <span style=\"height:32px;padding:0 18px;border-radius:999px;color:#A7AAB0;font-size:12px;font-weight:500;display:inline-flex;align-items:center\">Surface<\u002Fspan>\n  <\u002Fspan>\n  <span style=\"height:32px;padding:0 16px;border-radius:999px;background:rgba(232,200,143,.14);border:1px solid rgba(232,200,143,.45);color:#E8C88F;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px\">Selected chip <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n  <span style=\"height:32px;padding:0 16px;border-radius:999px;background:rgba(22,22,26,.32);border:1px solid rgba(255,255,255,.12);color:#C2C4C8;font-size:12px;font-weight:500;display:inline-flex;align-items:center\">Filter chip<\u002Fspan>\n  <span style=\"font-size:10px;color:#7E8188;line-height:1.6;flex-basis:100%;max-width:6.4in\">Segmented: container capsule pad 3, thumb slides between segments on spring.snappy (never crossfades); 2–4 segments max. Chips: 32 h capsules; selected = gold tint 14% + gold stroke 45%; a chip row scrolls horizontally, never wraps past two lines.<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"break-before:page;break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">07.5 — CARDS<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Three castes of card.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px\">\n  <figure style=\"break-inside:avoid;margin:0;border-radius:20px;border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,#0D0D10,#0A0A0C);box-shadow:0 1px 2px rgba(0,0,0,.3);padding:20px\">\n    <div style=\"font-size:9px;letter-spacing:.16em;color:#7E8188;margin-bottom:10px\">STANDARD · E1 · R 20 · PAD 24<\u002Fdiv>\n    <div style=\"font-size:15px;font-weight:600;color:#F4F4F6;margin-bottom:4px\">Propulsion report<\u002Fdiv>\n    <p style=\"margin:0 0 14px;font-size:11px;color:#A7AAB0;line-height:1.6\">Body content at TI-400. Hairline + G-3 lumen carry the depth; the shadow is nearly subliminal.<\u002Fp>\n    <span style=\"font-size:11.5px;font-weight:600;color:#E8C88F\">Open report →<\u002Fspan>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border-radius:20px;border:1px solid rgba(255,255,255,.14);background:rgba(22,22,26,.42);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.3);padding:20px\">\n    <div style=\"font-size:9px;letter-spacing:.16em;color:#7E8188;margin-bottom:10px\">GLASS · REGULAR POUR · R 20<\u002Fdiv>\n    <div style=\"font-size:15px;font-weight:600;color:#F4F4F6;margin-bottom:4px\">Now playing<\u002Fdiv>\n    <p style=\"margin:0 0 14px;font-size:11px;color:#C2C4C8;line-height:1.6\">Floats over imagery or data. Secondary text rides at TI-300 on glass (05.1 rule).<\u002Fp>\n    <span style=\"font-size:11.5px;font-weight:600;color:#F4F4F6\">Controls ›<\u002Fspan>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border-radius:20px;border:1px solid rgba(232,200,143,.4);background:linear-gradient(160deg,rgba(232,200,143,.10),rgba(232,200,143,.02) 55%),#0D0D10;box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 40px rgba(232,200,143,.06);padding:20px\">\n    <div style=\"font-size:9px;letter-spacing:.16em;color:#E8C88F;margin-bottom:10px\">CEREMONY · E5 · ONE PER VIEW<\u002Fdiv>\n    <div style=\"font-size:15px;font-weight:600;color:#F5E7CC;margin-bottom:4px\">Membership confirmed<\u002Fdiv>\n    <p style=\"margin:0 0 14px;font-size:11px;color:#D6C6A5;line-height:1.6\">The peak moment (D-07). Gold tint field, gold hairline, faint ambient bloom.<\u002Fp>\n    <span style=\"height:32px;padding:0 18px;border-radius:999px;background:linear-gradient(180deg,#EDD3A2,#D9B279);color:#1A1206;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center\">Begin<\u002Fspan>\n  <\u002Ffigure>\n<\u002Fdiv>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Hover on interactive cards: translateY −2, E1→E2, 160 ms; the whole card is the target, with one visible affordance line.<\u002Fli>\n  <li>Card anatomy order is fixed: eyebrow → title → body → data → action. Actions never precede content.<\u002Fli>\n  <li>Never nest cards. A card within a card becomes a well (OB-150 inset, r concentric).<\u002Fli>\n<\u002Ful>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">07.6 — NAVIGATION<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Glass bars over content.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#09090B;overflow:hidden\">\n    <div style=\"padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(22,22,26,.42);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.1)\">\n      <span style=\"font-size:12px;color:#E8C88F\">‹ Fleet<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#F4F4F6\">Meridian 7<\u002Fspan><span style=\"font-size:12px;color:#E8C88F\">Edit<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"height:66px;background:radial-gradient(80% 120% at 30% 0%,rgba(232,200,143,.06),transparent 60%)\"><\u002Fdiv>\n    <div style=\"margin:0 14px 14px;display:flex;justify-content:space-around;align-items:center;height:56px;border-radius:999px;background:rgba(22,22,26,.42);backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.4)\">\n      <span style=\"display:flex;flex-direction:column;align-items:center;gap:3px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"#E8C88F\"><path d=\"M12 3l9 7.5V21h-6v-6H9v6H3V10.5z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9px;font-weight:600;color:#E8C88F\">Base<\u002Fspan><\u002Fspan>\n      <span style=\"display:flex;flex-direction:column;align-items:center;gap:3px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A7AAB0\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M12 6.5v5.5l3.5 2\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9px;color:#A7AAB0\">Log<\u002Fspan><\u002Fspan>\n      <span style=\"display:flex;flex-direction:column;align-items:center;gap:3px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A7AAB0\" stroke-width=\"1.6\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\u002Fcircle><path d=\"M20 20l-4.2-4.2\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9px;color:#A7AAB0\">Search<\u002Fspan><\u002Fspan>\n      <span style=\"display:flex;flex-direction:column;align-items:center;gap:3px\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A7AAB0\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"8\" r=\"3.5\"><\u002Fcircle><path d=\"M5 19.5c1.6-3.2 4-4.5 7-4.5s5.4 1.3 7 4.5\"><\u002Fpath><\u002Fsvg><span style=\"font-size:9px;color:#A7AAB0\">You<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <figcaption style=\"padding:0 16px 14px;font-size:9.5px;color:#7E8188;line-height:1.6\">HANDHELD — top bar Glass Regular; floating capsule tab bar, 56 h, 3–5 tabs (D-02), active = filled glyph + gold, one only. Bar minimizes to 40 h on scroll-down, restores on scroll-up (240 ms).<\u002Ffigcaption>\n  <\u002Ffigure>\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#09090B;overflow:hidden;display:grid;grid-template-columns:1.35in 1fr\">\n    <div style=\"border-right:1px solid rgba(255,255,255,.08);background:#0B0B0E;padding:12px 8px;display:flex;flex-direction:column;gap:2px\">\n      <span style=\"font-size:8.5px;letter-spacing:.18em;color:#55575D;padding:0 10px 8px\">FLEET OPS<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:10px;background:rgba(232,200,143,.10);border-left:2px solid #E8C88F\"><span style=\"width:5px;height:5px;border-radius:50%;background:#E8C88F\"><\u002Fspan><span style=\"font-size:11px;font-weight:600;color:#F4F4F6\">Overview<\u002Fspan><\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:10px\"><span style=\"width:5px;height:5px;border-radius:50%;background:#55575D\"><\u002Fspan><span style=\"font-size:11px;color:#A7AAB0\">Telemetry<\u002Fspan><\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:10px\"><span style=\"width:5px;height:5px;border-radius:50%;background:#55575D\"><\u002Fspan><span style=\"font-size:11px;color:#A7AAB0\">Crew<\u002Fspan><\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:10px\"><span style=\"width:5px;height:5px;border-radius:50%;background:#55575D\"><\u002Fspan><span style=\"font-size:11px;color:#A7AAB0\">Archive<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08)\">\n        <span style=\"font-size:11px;color:#7E8188\">Fleet / <span style=\"color:#C2C4C8\">Overview<\u002Fspan><\u002Fspan>\n        <span style=\"margin-left:auto;height:28px;border-radius:999px;background:rgba(22,22,26,.6);border:1px solid rgba(255,255,255,.1);display:inline-flex;align-items:center;padding:0 9px;gap:5px;flex:none\"><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7E8188\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\u002Fcircle><path d=\"M20 20l-4.2-4.2\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10px;color:#55575D\">⌘K<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;background:radial-gradient(70% 100% at 50% 0%,rgba(232,200,143,.04),transparent 60%)\"><\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"grid-column:1/-1;padding:12px 16px;font-size:9.5px;color:#7E8188;line-height:1.6;border-top:1px solid rgba(255,255,255,.08)\">DESKTOP — rail 240 px (collapses to 64 px icons), active row = gold tint 10% + 2 px gold spine; breadcrumb + ⌘K command capsule in the header. Rail sections max 2 levels deep (D-02).<\u002Ffigcaption>\n  <\u002Ffigure>\n<\u002Fdiv>\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">07.7 — OVERLAYS: MODALS, SHEETS, POPOVERS, TOASTS<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Interruptions earn their altitude.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-bottom:14px\">\n  <figure style=\"break-inside:avoid;margin:0;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:radial-gradient(90% 120% at 50% 0%,#101014,#09090B);padding:26px;display:flex;align-items:center;justify-content:center\">\n    <div style=\"width:100%;max-width:290px;border-radius:24px;background:rgba(16,16,20,.85);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 16px rgba(0,0,0,.45),0 16px 48px rgba(0,0,0,.35);padding:24px\">\n      <div style=\"font-size:16px;font-weight:600;color:#F4F4F6;margin-bottom:6px\">Deorbit the array?<\u002Fdiv>\n      <p style=\"margin:0 0 18px;font-size:12px;color:#A7AAB0;line-height:1.6\">Panels 4–9 re-enter within 40 minutes. This cannot be recalled.<\u002Fp>\n      <div style=\"display:flex;gap:8px;justify-content:flex-end\">\n        <span style=\"height:36px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#F4F4F6;font-size:12px;font-weight:600;display:inline-flex;align-items:center\">Keep<\u002Fspan>\n        <span style=\"height:36px;padding:0 18px;border-radius:999px;background:rgba(201,111,94,.14);border:1px solid rgba(201,111,94,.45);color:#C96F5E;font-size:12px;font-weight:600;display:inline-flex;align-items:center\">Deorbit<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figcaption style=\"display:none\">modal<\u002Ffigcaption>\n  <\u002Ffigure>\n  <ul style=\"break-inside:avoid;margin:0;padding:20px 20px 20px 36px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;font-size:11px;color:#A7AAB0;line-height:1.8\">\n    <li>Dialog: width 320–420, r 24, Glass Deep, E4; scrim au.scrim + 8 px backdrop blur; enter scale .96→1 + fade over 240 ms spring.gentle; exit 160 ms.<\u002Fli>\n    <li>Title 18/24·600; body 13/18; actions right-aligned, cancel leftmost, destructive never gold.<\u002Fli>\n    <li>Sheets (handheld): slide from bottom, r 24 top corners only, 36×5 grabber at TI-800; detents at 50% / 92%; drag-to-dismiss with rubber-band.<\u002Fli>\n    <li>Popovers: r 16, Glass Regular, E3, max-width 320, anchored with 12 px collision-aware arrowless offset.<\u002Fli>\n    <li>Toasts: capsule, Glass Regular, E3, bottom-center; enter spring from +16 px; auto-dismiss 4 s (pause on hover); max one visible — queue the rest.<\u002Fli>\n    <li>Focus is trapped, first action focused, ⎋ always dismisses non-destructive overlays; background is inert.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">07.8 — STATUS: BADGES, PROGRESS, EMPTY STATES<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;padding:20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px\">\n  <span style=\"height:24px;padding:0 12px;border-radius:999px;background:rgba(111,174,143,.1);border:1px solid rgba(111,174,143,.35);color:#6FAE8F;font-size:10.5px;font-weight:600;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:5px;height:5px;border-radius:50%;background:#6FAE8F\"><\u002Fspan>NOMINAL<\u002Fspan>\n  <span style=\"height:24px;padding:0 12px;border-radius:999px;background:rgba(217,142,65,.1);border:1px solid rgba(217,142,65,.35);color:#D98E41;font-size:10.5px;font-weight:600;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:5px;height:5px;border-radius:50%;background:#D98E41\"><\u002Fspan>HOLD<\u002Fspan>\n  <span style=\"height:24px;padding:0 12px;border-radius:999px;background:rgba(201,111,94,.1);border:1px solid rgba(201,111,94,.35);color:#C96F5E;font-size:10.5px;font-weight:600;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px\"><span style=\"width:5px;height:5px;border-radius:50%;background:#C96F5E\"><\u002Fspan>ABORT<\u002Fspan>\n  <span style=\"height:24px;padding:0 12px;border-radius:999px;background:rgba(232,200,143,.1);border:1px solid rgba(232,200,143,.4);color:#E8C88F;font-size:10.5px;font-weight:600;letter-spacing:.06em;display:inline-flex;align-items:center\">★ RESERVE<\u002Fspan>\n  <span style=\"min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#C96F5E;color:#FBFBFC;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums\">3<\u002Fspan>\n  <span style=\"flex-basis:100%\"><\u002Fspan>\n  <div style=\"flex:1;min-width:200px\"><div style=\"height:4px;border-radius:2px;background:#26272E;overflow:hidden\"><span style=\"display:block;height:100%;width:68%;border-radius:2px;background:linear-gradient(90deg,#C89E63,#E8C88F)\"><\u002Fspan><\u002Fdiv><div style=\"display:flex;justify-content:space-between;margin-top:6px\"><span style=\"font-size:9.5px;color:#7E8188\">Determinate bar · 4 px · fill spring.gentle, never backward (D-10)<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;color:#E8C88F;font-variant-numeric:tabular-nums\">68%<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 28 28\" fill=\"none\"><circle cx=\"14\" cy=\"14\" r=\"11\" stroke=\"#26272E\" stroke-width=\"2.5\"><\u002Fcircle><path d=\"M14 3a11 11 0 018.6 4.2\" stroke=\"#E8C88F\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n  <span style=\"font-size:9.5px;color:#7E8188;max-width:150px;line-height:1.5\">Orbital spinner — 28 px, 0.9 s/rev, constant angular velocity<\u002Fspan>\n<\u002Fdiv>\n<ul style=\"margin:0 0 24px;padding-left:18px;font-size:11.5px;color:#A7AAB0;line-height:1.8;max-width:6.6in\">\n  <li>Badges are 24 h capsules: tinted field 10%, stroke 35%, dot 5 px; text overline-cased. Count badges are Oxide-filled, cap at 99+.<\u002Fli>\n  <li>Skeletons mirror final layout exactly (no layout shift at arrival) and shimmer OB-200→OB-300 at 1.6 s; content crossfades in over 240 ms, stagger 40 ms/row.<\u002Fli>\n  <li>Empty states are furnished rooms: 40 px glyph at TI-700, one headline (title style), one sentence, one action. Never a sad-face illustration.<\u002Fli>\n<\u002Ful>\n\n<div style=\"break-inside:avoid\">\n<div style=\"font-size:10.5px;letter-spacing:.24em;color:#E8C88F;font-weight:600;margin:0 0 8px\">07.9 — DATA: TABLES, LISTS, KEY FIGURES<\u002Fdiv>\n<h2 style=\"font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#F4F4F6;margin:0 0 12px\">Telemetry discipline.<\u002Fh2>\n<\u002Fdiv>\n<figure style=\"break-inside:avoid;margin:0 0 14px;border:1px solid rgba(255,255,255,.09);border-radius:16px;background:#0C0C0F;overflow:hidden\">\n  <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1fr .9fr;padding:10px 18px;border-bottom:1px solid rgba(232,200,143,.25)\">\n    <span style=\"font-size:9px;letter-spacing:.14em;color:#7E8188;font-weight:600\">VEHICLE<\u002Fspan><span style=\"font-size:9px;letter-spacing:.14em;color:#7E8188;font-weight:600;text-align:right\">APOGEE KM<\u002Fspan><span style=\"font-size:9px;letter-spacing:.14em;color:#E8C88F;font-weight:600;text-align:right\">Δ-V M/S ▾<\u002Fspan><span style=\"font-size:9px;letter-spacing:.14em;color:#7E8188;font-weight:600;text-align:right\">STATUS<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.6fr 1fr 1fr .9fr;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,.05);align-items:center;background:rgba(232,200,143,.05)\">\n    <span style=\"font-size:12px;color:#F4F4F6;font-weight:500;border-left:2px solid #E8C88F;padding-left:10px;margin-left:-12px\">Meridian 7 · selected<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:11.5px;color:#D6D7DA;text-align:right;font-variant-numeric:tabular-nums\">418.2<\u002Fspan><span style=\"font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:11.5px;color:#D6D7DA;tex Fli>\n  <li>Key figures (dashboard stats): value display-m 34/40·700 TI-100 tabular; label overline above; delta chip beside (Patina ▲ / Oxide ▼); never more than 4 key figures per row.<\u002Fli>\n<\u002Ful>\n<div data-screen-label=\"Part 08 — Motion\" style=\"break-before:page;break-after:page;min-height:calc(100vh - 128px);display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:14px\">\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#7E8188;font-weight:500\">PART&nbsp;08<\u002Fspan>\n    <span style=\"font-size:10px;letter-spacing:.3em;color:#E8C88F;font-weight:500\">PHYSICS<\u002Fspan>\n  <\u002Fdiv>\n  <div>\n    <div style=\"font-size:190px;font-weight:700;line-height:.9;color:transparent;-webkit-text-stroke:1px rgba(232,200,143,.30);letter-spacing:-.02em\">08<\u002Fdiv>\n    <h1 style=\"font-size:52px;font-weight:700;letter-spacing:-0.025em;color:#F4F4F6;margin:18px 0 22px;line-height:1.05\">Motion —<br>The 120 fps Doctrine<\u002Fh1>\n    <p style=\"max-width:5.6in;font-size:14.5px;line-height:1.75;color:#A7AAB0;margin:0\">AURUM animates the way a chronograph sweeps: continuously, causally, and at the native cadence of the display. Five durations, four springs, one choreography law. Everything else is forbidden motion.<\u002Fp>\n  <\u002Fdiv>\n  <div>\n    <svg width=\"100%\" height=\"120\" sc-camel-view-box=\"0 0 720 120\" style=\"display:block\">\n      <line x1=\"0\" y1=\"100\" x2=\"720\" y2=\"100\" stroke=\"rgba(255,255,255,.12)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"20\" x2=\"720\" y2=\"20\" stroke=\"rgba(255,255,255,.06)\" stroke-width=\"1\" stroke-dasharray=\"3 5\"><\u002Fline>\n      <path d=\"M0,100 C80,100 90,14 180,17 C230,19 250,24 300,21 C350,19 380,20 720,20\" fill=\"none\" stroke=\"#E8C88F\" stroke-width=\"2\"><\u002Fpath>\n      <path d=\"M0,100 C120,100 200,20 7
