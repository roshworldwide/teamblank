[project]
name = "sentinelwipe"
version = "0.0.0"
description = "Forensic data sanitization with adversarial verification. SIH 2026 PS 26149."
requires-python = "==3.11.*"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
sentinelwipe = "sentinelwipe.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py/sentinelwipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py"]
